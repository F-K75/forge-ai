services:
  nginx:
    image: ghcr.io/${GHCR_OWNER:?}/forge-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:?}
      - STAGING_DOMAIN=${STAGING_DOMAIN:-}
    volumes:
      - ./deploy/nginx/templates:/etc/nginx/templates:ro
      - letsencrypt:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    # Reload every 6h so renewed certificates get picked up; re-entering the
    # image entrypoint keeps the template envsubst step.
    command: /bin/sh -c "(while :; do sleep 6h; nginx -s reload; done) & exec /docker-entrypoint.sh nginx -g 'daemon off;'"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  backend:
    image: ghcr.io/${GHCR_OWNER:?}/forge-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:?}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - TOGETHER_API_KEY=${TOGETHER_API_KEY:-}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY:-}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:-}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:?}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:?}
      - STRIPE_PUBLISHABLE_KEY=${STRIPE_PUBLISHABLE_KEY:?}
      - STRIPE_PRICE_STANDARD_MONTHLY=${STRIPE_PRICE_STANDARD_MONTHLY:?}
      - STRIPE_PRICE_PRO_MONTHLY=${STRIPE_PRICE_PRO_MONTHLY:?}
      - STRIPE_PRICE_ENTERPRISE_MONTHLY=${STRIPE_PRICE_ENTERPRISE_MONTHLY:?}
      - STRIPE_PRICE_STANDARD_ANNUAL=${STRIPE_PRICE_STANDARD_ANNUAL:?}
      - STRIPE_PRICE_PRO_ANNUAL=${STRIPE_PRICE_PRO_ANNUAL:?}
      - STRIPE_PRICE_ENTERPRISE_ANNUAL=${STRIPE_PRICE_ENTERPRISE_ANNUAL:?}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - MONGODB_URL=mongodb://forge:${MONGO_PASSWORD:?}@mongo:27017/forge?authSource=admin
      - REDIS_URL=redis://:${REDIS_PASSWORD:?}@redis:6379
      - JWT_SECRET=${JWT_SECRET:?}
      - FIELD_ENCRYPTION_KEY=${FIELD_ENCRYPTION_KEY:?}
      - APP_ENV=production
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:?}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:?}@redis:6379/0
      - ADMIN_EMAILS=${ADMIN_EMAILS:?}
      - APP_URL=https://${DOMAIN:?}
      - API_URL=https://${DOMAIN:?}/api
      - ALLOWED_ORIGINS=https://${DOMAIN:?}
      # Host that deployed-app preview containers are reachable at (PROD-004)
      - DEPLOYMENT_HOST=${DOMAIN:?}
      # localhost stays allowed for the container healthcheck
      - ALLOWED_HOSTS=${DOMAIN:?},localhost
      - TRUSTED_PROXIES=127.0.0.1,::1,172.28.0.0/16
      - FORWARDED_ALLOW_IPS=172.28.0.0/16
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  worker:
    image: ghcr.io/${GHCR_OWNER:?}/forge-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    # Celery's SIGTERM handler already does a warm shutdown (finish in-flight
    # tasks, stop accepting new ones), but Compose's default 10s grace period
    # was far shorter than a single build can take (build_timeout is 600s),
    # so `docker compose stop`/a deploy would still SIGKILL a worker
    # mid-build regardless (BE-005).
    stop_grace_period: 630s
    command: ["celery", "-A", "celery_app", "worker", "--loglevel=info", "--concurrency=2", "-Q", "celery,deployment,build"]
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:?}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - TOGETHER_API_KEY=${TOGETHER_API_KEY:-}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY:-}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:?}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:?}
      - STRIPE_PUBLISHABLE_KEY=${STRIPE_PUBLISHABLE_KEY:?}
      - STRIPE_PRICE_STANDARD_MONTHLY=${STRIPE_PRICE_STANDARD_MONTHLY:?}
      - STRIPE_PRICE_PRO_MONTHLY=${STRIPE_PRICE_PRO_MONTHLY:?}
      - STRIPE_PRICE_ENTERPRISE_MONTHLY=${STRIPE_PRICE_ENTERPRISE_MONTHLY:?}
      - STRIPE_PRICE_STANDARD_ANNUAL=${STRIPE_PRICE_STANDARD_ANNUAL:?}
      - STRIPE_PRICE_PRO_ANNUAL=${STRIPE_PRICE_PRO_ANNUAL:?}
      - STRIPE_PRICE_ENTERPRISE_ANNUAL=${STRIPE_PRICE_ENTERPRISE_ANNUAL:?}
      - MONGODB_URL=mongodb://forge:${MONGO_PASSWORD:?}@mongo:27017/forge?authSource=admin
      - REDIS_URL=redis://:${REDIS_PASSWORD:?}@redis:6379
      - JWT_SECRET=${JWT_SECRET:?}
      - FIELD_ENCRYPTION_KEY=${FIELD_ENCRYPTION_KEY:?}
      - APP_ENV=production
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:?}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:?}@redis:6379/0
      - ADMIN_EMAILS=${ADMIN_EMAILS:?}
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A celery_app inspect ping -d celery@$$HOSTNAME"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G

  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: forge
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?}", "--appendonly", "yes"]
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:?}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  certbot:
    image: certbot/certbot
    restart: unless-stopped
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done"

  backup:
    image: alpine:3.19
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - mongo_data:/data/db:ro
      - backup_data:/backups
      - ./scripts:/app/scripts:ro
    environment:
      - MONGODB_URL=mongodb://forge:${MONGO_PASSWORD:?}@mongo:27017/forge?authSource=admin
      - BACKUP_RETENTION_DAYS=30
      - BACKUP_FAILURE_WEBHOOK_URL=${BACKUP_FAILURE_WEBHOOK_URL:-}
    entrypoint: /bin/sh
    command:
      - -c
      - |
        apk add --no-cache mongodb-tools python3 py3-pip curl &&
        mkdir -p /var/log && touch /var/log/backup.log &&
        printf '%s\n' \
          "0 2 * * * python3 /app/scripts/backup_mongodb.py >> /var/log/backup.log 2>&1" \
          "0 14 * * * python3 /app/scripts/backup_verify.py /backups/latest >> /var/log/backup.log 2>&1" |
          crontab - &&
        tail -F /var/log/backup.log &
        crond -f -l 2
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 128M

networks:
  default:
    name: forge
    ipam:
      config:
        # Fixed so TRUSTED_PROXIES / FORWARDED_ALLOW_IPS stay valid
        - subnet: 172.28.0.0/16

volumes:
  mongo_data:
  redis_data:
  letsencrypt:
  certbot_www:
  backup_data:
