name = "forge-frontend"
compatibility_date = "2026-08-02"
compatibility_flags = ["nodejs_compat"]

[build]
command = "cd frontend && npm ci && npm run build"
watch_dirs = ["frontend/src"]

[site]
bucket = "frontend/dist"

# Production frontend URL: https://forge-frontend.pages.dev
# Backend API URL: https://forge-ai-ioom.onrender.com
# Set these environment variables in Cloudflare Pages dashboard:
#   VITE_API_URL=https://forge-ai-ioom.onrender.com
#   VITE_WS_URL=wss://forge-ai-ioom.onrender.com
