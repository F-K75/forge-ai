    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "Forge AI",
      "applicationCategory": "DeveloperApplication",
      "operatingSystem": "Web",
      "description": "Forge AI is an AI engineering organization: specialist agents for product, architecture, design, engineering, integration, and QA plan, build, and validate production software from a single prompt.",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "author": {
        "@type": "Organization",
        "name": "Forge AI"
      }
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "How is Forge different from a code-completion tool?",
          "acceptedAnswer": { "@type": "Answer", "text": "Autocomplete finishes a line. Forge's agents plan, build, and validate a full application from a single prompt." }
        },
        {
          "@type": "Question",
          "name": "Is this just a chatbot with extra steps?",
          "acceptedAnswer": { "@type": "Answer", "text": "No. Forge doesn't wait for you to prompt each step. Specialist agents plan, hand off, and validate the build on their own — you step in to review and ship." }
        },
        {
          "@type": "Question",
          "name": "Do I own the code Forge writes?",
          "acceptedAnswer": { "@type": "Answer", "text": "Yes. Every build can sync to a GitHub repository you control — no lock-in." }
        },
        {
          "@type": "Question",
          "name": "What happens if a build fails validation?",
          "acceptedAnswer": { "@type": "Answer", "text": "The debug loop automatically reruns the responsible agent, up to three times, before a build is marked failed." }
        },
        {
          "@type": "Question",
          "name": "Can I use my own model key?",
          "acceptedAnswer": { "@type": "Answer", "text": "Yes — on the Pro plan you can bring your own Anthropic key for full control over usage and cost." }
        },
        {
          "@type": "Question",
          "name": "Can Forge work with an existing codebase?",
          "acceptedAnswer": { "@type": "Answer", "text": "Today, Forge builds new projects from a prompt. Support for extending existing codebases is on the roadmap." }
        }
      ]
    }
    </script>
