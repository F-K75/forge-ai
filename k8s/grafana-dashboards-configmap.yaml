apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/name: grafana-dashboards
    app.kubernetes.io/part-of: forge-ai
    app.kubernetes.io/managed-by: kustomize
data:
  forge-ai-overview.json: |
    {
      "dashboard": {
        "title": "Forge AI Overview",
        "uid": "forge-ai-overview",
        "panels": [
          {
            "title": "Request Rate",
            "targets": [
              {
                "expr": "rate(http_requests_total[5m])"
              }
            ],
            "type": "graph"
          },
          {
            "title": "Error Rate",
            "targets": [
              {
                "expr": "rate(http_requests_total{status=~\"5..\"}[5m])"
              }
            ],
            "type": "graph"
          },
          {
            "title": "Response Time (p95)",
            "targets": [
              {
                "expr": "histogram_quantile(0.95, http_request_duration_seconds_bucket)"
              }
            ],
            "type": "graph"
          },
          {
            "title": "Active Builds",
            "targets": [
              {
                "expr": "celery_active_tasks"
              }
            ],
            "type": "stat"
          },
          {
            "title": "Build Queue Depth",
            "targets": [
              {
                "expr": "celery_queue_depth"
              }
            ],
            "type": "stat"
          },
          {
            "title": "LLM Token Usage",
            "targets": [
              {
                "expr": "sum by (direction) (rate(llm_tokens_total[5m]))"
              }
            ],
            "type": "graph"
          },
          {
            "title": "LLM Cost (USD)",
            "targets": [
              {
                "expr": "llm_cost_by_provider_usd"
              }
            ],
            "type": "graph"
          },
          {
            "title": "Database Connections",
            "targets": [
              {
                "expr": "mongodb_connections{state=\"current\"}"
              }
            ],
            "type": "stat"
          }
        ]
      }
    }
  forge-ai-database.json: |
    {
      "dashboard": {
        "title": "Forge AI Database",
        "uid": "forge-ai-database",
        "panels": [
          {
            "title": "MongoDB Connections",
            "targets": [
              {
                "expr": "mongodb_connections{state=\"current\"}"
              }
            ],
            "type": "graph"
          },
          {
            "title": "MongoDB Operations",
            "targets": [
              {
                "expr": "sum by (type) (rate(mongodb_op_counters_total[5m]))"
              }
            ],
            "type": "graph"
          },
          {
            "title": "MongoDB Latency (avg by op type)",
            "targets": [
              {
                "expr": "rate(mongodb_mongod_op_latencies_latency_total[5m]) / rate(mongodb_mongod_op_latencies_ops_total[5m])"
              }
            ],
            "type": "graph"
          },
          {
            "title": "Redis Connections",
            "targets": [
              {
                "expr": "redis_connected_clients"
              }
            ],
            "type": "graph"
          },
          {
            "title": "Redis Operations",
            "targets": [
              {
                "expr": "sum(rate(redis_commands_total[5m]))"
              }
            ],
            "type": "graph"
          },
          {
            "title": "Redis Hit Rate",
            "targets": [
              {
                "expr": "rate(redis_keyspace_hits_total[5m]) / (rate(redis_keyspace_hits_total[5m]) + rate(redis_keyspace_misses_total[5m]))"
              }
            ],
            "type": "graph"
          }
        ]
      }
    }
  forge-ai-ai-pipeline.json: |
    {
      "dashboard": {
        "title": "Forge AI Pipeline",
        "uid": "forge-ai-ai-pipeline",
        "panels": [
          {
            "title": "Agent Success Rate",
            "targets": [
              {
                "expr": "sum(rate(llm_requests_total{status=\"success\"}[5m])) by (agent) / sum(rate(llm_requests_total[5m])) by (agent)"
              }
            ],
            "type": "graph"
          },
          {
            "title": "LLM Request Duration (p95) by Provider/Model",
            "targets": [
              {
                "expr": "histogram_quantile(0.95, sum(rate(llm_request_duration_seconds_bucket[5m])) by (le, provider, model))"
              }
            ],
            "type": "graph"
          },
          {
            "title": "LLM Token Usage by Model",
            "targets": [
              {
                "expr": "sum by (model) (rate(llm_tokens_total[5m]))"
              }
            ],
            "type": "graph"
          },
          {
            "title": "LLM Cost by Provider",
            "targets": [
              {
                "expr": "sum by (provider) (llm_cost_by_provider_usd)"
              }
            ],
            "type": "graph"
          },
          {
            "title": "Build Success Rate",
            "targets": [
              {
                "expr": "rate(build_outcomes_total{status=\"success\"}[5m]) / rate(build_outcomes_total[5m])"
              }
            ],
            "type": "graph"
          },
          {
            "title": "Average Build Time",
            "targets": [
              {
                "expr": "histogram_quantile(0.95, build_duration_seconds_bucket)"
              }
            ],
            "type": "graph"
          }
        ]
      }
    }
