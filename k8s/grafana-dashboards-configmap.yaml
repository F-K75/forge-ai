apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  forge-ai-overview.json: |
    {
      "dashboard": {
        "title": "Forge AI Overview",
        "uid": "forge-ai-overview",
        "panels": [
          {
            "title": "Request Rate",
            "targets": [
              {
                "expr": "rate(http_requests_total[5m])"
              }
            ],
            "type": "graph"
          },
          {
            "title": "Error Rate",
            "targets": [
              {
                "expr": "rate(http_requests_total{status=~\"5..\"}[5m])"
              }
            ],
            "type": "graph"
          },
          {
            "title": "Response Time (p95)",
            "targets": [
              {
                "expr": "histogram_quantile(0.95, http_request_duration_seconds_bucket)"
              }
            ],
            "type": "graph"
          },
          {
            "title": "Active Builds",
            "targets": [
              {
                "expr": "celery_active_tasks"
              }
            ],
            "type": "stat"
          },
          {
            "title": "Build Queue Depth",
            "targets": [
              {
                "expr": "celery_queue_depth"
              }
            ],
            "type": "stat"
          },
          {
            "title": "LLM Token Usage",
            "targets": [
              {
                "expr": "rate(llm_tokens_total[5m])"
              }
            ],
            "type": "graph"
          },
          {
            "title": "LLM Cost (USD)",
            "targets": [
              {
                "expr": "rate(llm_cost_usd_total[5m])"
              }
            ],
            "type": "graph"
          },
          {
            "title": "Database Connections",
            "targets": [
              {
                "expr": "mongodb_connections_active"
              }
            ],
            "type": "stat"
          }
        ]
      }
    }
  forge-ai-database.json: |
    {
      "dashboard": {
        "title": "Forge AI Database",
        "uid": "forge-ai-database",
        "panels": [
          {
            "title": "MongoDB Connections",
            "targets": [
              {
                "expr": "mongodb_connections_active"
              }
            ],
            "type": "graph"
          },
          {
            "title": "MongoDB Operations",
            "targets": [
              {
                "expr": "rate(mongodb_operations_total[5m])"
              }
            ],
            "type": "graph"
          },
          {
            "title": "MongoDB Latency",
            "targets": [
              {
                "expr": "histogram_quantile(0.95, mongodb_operation_duration_seconds_bucket)"
              }
            ],
            "type": "graph"
          },
          {
            "title": "Redis Connections",
            "targets": [
              {
                "expr": "redis_connected_clients"
              }
            ],
            "type": "graph"
          },
          {
            "title": "Redis Operations",
            "targets": [
              {
                "expr": "rate(redis_commands_total[5m])"
              }
            ],
            "type": "graph"
          },
          {
            "title": "Redis Hit Rate",
            "targets": [
              {
                "expr": "rate(redis_keyspace_hits[5m]) / (rate(redis_keyspace_hits[5m]) + rate(redis_keyspace_misses[5m]))"
              }
            ],
            "type": "graph"
          }
        ]
      }
    }
  forge-ai-ai-pipeline.json: |
    {
      "dashboard": {
        "title": "Forge AI Pipeline",
        "uid": "forge-ai-ai-pipeline",
        "panels": [
          {
            "title": "Agent Success Rate",
            "targets": [
              {
                "expr": "rate(agent_calls_total{status=\"success\"}[5m]) / rate(agent_calls_total[5m])"
              }
            ],
            "type": "graph"
          },
          {
            "title": "Agent Duration",
            "targets": [
              {
                "expr": "histogram_quantile(0.95, agent_duration_seconds_bucket)"
              }
            ],
            "type": "graph"
          },
          {
            "title": "LLM Token Usage by Model",
            "targets": [
              {
                "expr": "sum by (model) (rate(llm_tokens_total[5m]))"
              }
            ],
            "type": "graph"
          },
          {
            "title": "LLM Cost by Model",
            "targets": [
              {
                "expr": "sum by (model) (rate(llm_cost_usd_total[5m]))"
              }
            ],
            "type": "graph"
          },
          {
            "title": "Build Success Rate",
            "targets": [
              {
                "expr": "rate(builds_total{status=\"success\"}[5m]) / rate(builds_total[5m])"
              }
            ],
            "type": "graph"
          },
          {
            "title": "Average Build Time",
            "targets": [
              {
                "expr": "histogram_quantile(0.95, build_duration_seconds_bucket)"
              }
            ],
            "type": "graph"
          }
        ]
      }
    }
