apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/name: grafana-dashboards
    app.kubernetes.io/part-of: forge-ai
    app.kubernetes.io/managed-by: kustomize
data:
  forge-ai-overview.json: |
    {
      "dashboard": {
        "title": "Forge AI Overview",
        "uid": "forge-ai-overview",
        "panels": [
          {
            "title": "Not yet instrumented",
            "type": "text",
            "content": "LLM Token Usage and Database Connections below have no data source yet: no LLM token-volume counter is instrumented, and no mongodb_exporter is deployed (see backend/core/metrics.py for what's actually instrumented). Left in place as a to-do, not deleted."
          },
          {
            "title": "Request Rate",
            "targets": [
              {
                "expr": "rate(http_requests_total[5m])"
              }
            ],
            "type": "graph"
          },
          {
            "title": "Error Rate",
            "targets": [
              {
                "expr": "rate(http_requests_total{status=~\"5..\"}[5m])"
              }
            ],
            "type": "graph"
          },
          {
            "title": "Response Time (p95)",
            "targets": [
              {
                "expr": "histogram_quantile(0.95, http_request_duration_seconds_bucket)"
              }
            ],
            "type": "graph"
          },
          {
            "title": "Active Builds",
            "targets": [
              {
                "expr": "celery_active_tasks"
              }
            ],
            "type": "stat"
          },
          {
            "title": "Build Queue Depth",
            "targets": [
              {
                "expr": "celery_queue_depth"
              }
            ],
            "type": "stat"
          },
          {
            "title": "LLM Token Usage",
            "targets": [
              {
                "expr": "rate(llm_tokens_total[5m])"
              }
            ],
            "type": "graph"
          },
          {
            "title": "LLM Cost (USD)",
            "targets": [
              {
                "expr": "llm_cost_by_provider_usd"
              }
            ],
            "type": "graph"
          },
          {
            "title": "Database Connections",
            "targets": [
              {
                "expr": "mongodb_connections_active"
              }
            ],
            "type": "stat"
          }
        ]
      }
    }
  forge-ai-database.json: |
    {
      "dashboard": {
        "title": "Forge AI Database",
        "uid": "forge-ai-database",
        "panels": [
          {
            "title": "Not yet instrumented",
            "type": "text",
            "content": "This entire dashboard has no data source yet: no mongodb_exporter or redis_exporter is deployed anywhere (k8s/mongodb.yaml, k8s/redis.yaml), and no `job=\"mongodb\"`/`job=\"redis\"` Prometheus scrape target exists. Every panel below will show no data until an exporter is added. Left in place as a to-do, not deleted."
          },
          {
            "title": "MongoDB Connections",
            "targets": [
              {
                "expr": "mongodb_connections_active"
              }
            ],
            "type": "graph"
          },
          {
            "title": "MongoDB Operations",
            "targets": [
              {
                "expr": "rate(mongodb_operations_total[5m])"
              }
            ],
            "type": "graph"
          },
          {
            "title": "MongoDB Latency",
            "targets": [
              {
                "expr": "histogram_quantile(0.95, mongodb_operation_duration_seconds_bucket)"
              }
            ],
            "type": "graph"
          },
          {
            "title": "Redis Connections",
            "targets": [
              {
                "expr": "redis_connected_clients"
              }
            ],
            "type": "graph"
          },
          {
            "title": "Redis Operations",
            "targets": [
              {
                "expr": "rate(redis_commands_total[5m])"
              }
            ],
            "type": "graph"
          },
          {
            "title": "Redis Hit Rate",
            "targets": [
              {
                "expr": "rate(redis_keyspace_hits[5m]) / (rate(redis_keyspace_hits[5m]) + rate(redis_keyspace_misses[5m]))"
              }
            ],
            "type": "graph"
          }
        ]
      }
    }
  forge-ai-ai-pipeline.json: |
    {
      "dashboard": {
        "title": "Forge AI Pipeline",
        "uid": "forge-ai-ai-pipeline",
        "panels": [
          {
            "title": "Not yet instrumented",
            "type": "text",
            "content": "LLM Token Usage by Model below has no data source: no token-volume counter is instrumented (llm_requests_total counts calls, not tokens). Left in place as a to-do, not deleted."
          },
          {
            "title": "Agent Success Rate",
            "targets": [
              {
                "expr": "sum(rate(llm_requests_total{status=\"success\"}[5m])) by (agent) / sum(rate(llm_requests_total[5m])) by (agent)"
              }
            ],
            "type": "graph"
          },
          {
            "title": "LLM Request Duration (p95) by Provider/Model",
            "targets": [
              {
                "expr": "histogram_quantile(0.95, sum(rate(llm_request_duration_seconds_bucket[5m])) by (le, provider, model))"
              }
            ],
            "type": "graph"
          },
          {
            "title": "LLM Token Usage by Model",
            "targets": [
              {
                "expr": "sum by (model) (rate(llm_tokens_total[5m]))"
              }
            ],
            "type": "graph"
          },
          {
            "title": "LLM Cost by Provider",
            "targets": [
              {
                "expr": "sum by (provider) (llm_cost_by_provider_usd)"
              }
            ],
            "type": "graph"
          },
          {
            "title": "Build Success Rate",
            "targets": [
              {
                "expr": "rate(build_outcomes_total{status=\"success\"}[5m]) / rate(build_outcomes_total[5m])"
              }
            ],
            "type": "graph"
          },
          {
            "title": "Average Build Time",
            "targets": [
              {
                "expr": "histogram_quantile(0.95, build_duration_seconds_bucket)"
              }
            ],
            "type": "graph"
          }
        ]
      }
    }
