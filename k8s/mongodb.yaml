apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb
  namespace: forge-ai-prod
  labels:
    app: mongodb
    component: database
spec:
  serviceName: mongodb
  replicas: 3
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      containers:
      - name: mongodb
        image: mongo:7.0.5
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 27017
          name: mongodb
        env:
        - name: MONGO_INITDB_ROOT_USERNAME
          value: "forge"
        - name: MONGO_INITDB_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: forge-ai-secrets
              key: mongo-password
        command:
        - mongod
        - --replSet
        - rs0
        - --keyFile
        - /data/keyfile
        volumeMounts:
        - name: mongodb-data
          mountPath: /data/db
        - name: keyfile
          mountPath: /data/keyfile
          subPath: keyfile
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        livenessProbe:
          exec:
            command:
            - mongosh
            - --eval
            - "db.adminCommand('ping')"
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 5
        readinessProbe:
          exec:
            command:
            - mongosh
            - --eval
            - "db.adminCommand('ping')"
          initialDelaySeconds: 15
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
      # Prometheus exporter sidecar: serves the "Forge AI Database" Grafana
      # dashboard and the DatabaseDown alert (job="mongodb"). --compatible-mode
      # keeps the classic mongodb_* metric names the dashboard queries.
      - name: mongodb-exporter
        image: percona/mongodb_exporter:0.40.0
        imagePullPolicy: IfNotPresent
        args:
        - --collect-all
        - --compatible-mode
        env:
        - name: MONGO_PASSWORD
          valueFrom:
            secretKeyRef:
              name: forge-ai-secrets
              key: mongo-password
        - name: MONGODB_URI
          value: "mongodb://forge:$(MONGO_PASSWORD)@localhost:27017/admin"
        ports:
        - containerPort: 9216
          name: metrics
        resources:
          requests:
            memory: "64Mi"
            cpu: "25m"
          limits:
            memory: "128Mi"
            cpu: "100m"
        securityContext:
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
      volumes:
      - name: keyfile
        secret:
          secretName: mongodb-keyfile
  volumeClaimTemplates:
  - metadata:
      name: mongodb-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: standard
      resources:
        requests:
          storage: 10Gi
---
# PodDisruptionBudget: keep at least 2 of 3 replicas up during voluntary
# disruptions (node drains, cluster upgrades) so the replica set retains a
# primary and quorum is never lost.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: mongodb
  namespace: forge-ai-prod
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: mongodb
---
# Headless service for MongoDB replica set
apiVersion: v1
kind: Service
metadata:
  name: mongodb
  namespace: forge-ai-prod
  labels:
    app: mongodb
spec:
  clusterIP: None
  ports:
  - port: 27017
    name: mongodb
  selector:
    app: mongodb
---
# Client service for MongoDB (load-balanced connections)
apiVersion: v1
kind: Service
metadata:
  name: mongodb-client
  namespace: forge-ai-prod
  labels:
    app: mongodb
spec:
  ports:
  - port: 27017
    targetPort: 27017
    name: mongodb
  selector:
    app: mongodb
---
# Init job to configure replica set
apiVersion: batch/v1
kind: Job
metadata:
  name: mongodb-replica-init
  namespace: forge-ai-prod
spec:
  template:
    spec:
      containers:
      - name: mongo-init
        image: mongo:7.0.5
        command:
        - bash
        - -c
        - |
          set -e
          sleep 10
          # Idempotent: only initiate if the replica set is not already
          # configured. Re-running this Job (redeploy, crash-loop) must not fail
          # with "already initiated".
          STATUS=$(mongosh --quiet mongodb://mongodb:27017/admin --eval 'rs.status().ok' 2>/dev/null || echo "0")
          if [ "$STATUS" = "1" ]; then
            echo "Replica set rs0 already initiated; skipping."
            exit 0
          fi
          mongosh mongodb://mongodb:27017/admin --eval '
            rs.initiate({
              _id: "rs0",
              members: [
                {_id: 0, host: "mongodb-0.mongodb:27017"},
                {_id: 1, host: "mongodb-1.mongodb:27017"},
                {_id: 2, host: "mongodb-2.mongodb:27017"}
              ]
            });
          '
          echo "Replica set rs0 initiated."
      restartPolicy: Never
  backoffLimit: 5
  parallelism: 1
  # Auto-clean the completed init Job so it does not linger / re-trigger.
  ttlSecondsAfterFinished: 300