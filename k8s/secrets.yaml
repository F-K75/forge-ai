# Kubernetes Secrets Configuration
# This file documents the required secrets structure. DO NOT commit actual secrets.
# Secrets should be populated from an external secret manager (HashiCorp Vault, AWS Secrets Manager,
# Azure Key Vault, GCP Secret Manager) or CI/CD pipeline at deployment time.
#
# For development, use `skaffold dev` with `skaffold.yaml` that injects secrets from .env or local dev secret.
# For production, use External Secrets Operator, Sealed Secrets, or Helm secrets management.

---
# Production Secrets - populated from external secret manager
apiVersion: v1
kind: Secret
metadata:
  name: forge-ai-secrets
  namespace: forge-ai-prod
  annotations:
    # Example: External Secrets Operator annotation
    # external-secrets.io/provider: "aws"
    # external-secrets.io/secret-name: "forge-ai-production"
type: Opaque
stringData:
  # These keys MUST be populated at deployment time. See docs/secrets.md
  jwt-secret: ""       # Required: 64+ hex chars for HS256
  field-encryption-key: ""  # Required: 64 hex chars for Fernet encryption (separate from JWT secret)
  stripe-secret-key: ""    # Required: Production Stripe secret key
  stripe-webhook-secret: "" # Required: Stripe webhook signing secret
  mongo-password: ""   # Required: MongoDB admin password
  redis-password: ""   # Required: Redis password (can be disabled for dev)
  anthropic-api-key: "" # Required: Anthropic API key
  openai-api-key: ""   # Optional: OpenAI API key for fallback model
  resend-api-key: ""   # Required: Email service API key
  github-client-id: "" # Required: GitHub OAuth app client ID
  github-client-secret: "" # Required: GitHub OAuth app client secret
  mongodb-url: "" # Required: Full MongoDB connection URI for backups
  aws-access-key-id: "" # Optional: AWS access key for S3 backups
  aws-secret-access-key: "" # Optional: AWS secret key for S3 backups
  s3-bucket: "" # Optional: S3 bucket name for backups

---
# Staging Secrets - populated from external secret manager
apiVersion: v1
kind: Secret
metadata:
  name: forge-ai-secrets
  namespace: forge-ai-staging
  annotations:
    # Example: External Secrets Operator annotation
    # external-secrets.io/provider: "aws"
    # external-secrets.io/secret-name: "forge-ai-staging"
type: Opaque
stringData:
  jwt-secret: ""
  field-encryption-key: ""
  stripe-secret-key: ""
  stripe-webhook-secret: ""
  mongo-password: ""
  redis-password: ""
  anthropic-api-key: ""
  openai-api-key: ""
  resend-api-key: ""
  github-client-id: ""
  github-client-secret: ""

---
# Production ConfigMap - non-sensitive configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: forge-ai-config
  namespace: forge-ai-prod
data:
  app-url: "https://forge.ai"
  api-url: "https://api.forge.ai"
  allowed-origins: "https://forge.ai,https://app.forge.ai"
  cors-allow-origins: ""
  admin-emails: "admin@forge.ai"
  build-timeout: "600"
  sandbox-timeout: "120"

---
# Staging ConfigMap - non-sensitive configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: forge-ai-config
  namespace: forge-ai-staging
data:
  app-url: "https://staging.forge.ai"
  api-url: "https://staging-api.forge.ai"
  allowed-origins: "https://staging.forge.ai"
  cors-allow-origins: ""
  admin-emails: "admin@forge.ai"
  build-timeout: "600"
  sandbox-timeout: "120"