apiVersion: v1
kind: Service
metadata:
  name: backend-metrics
  namespace: forge-ai-prod
  labels:
    app: backend
    metrics: "true"
spec:
  selector:
    app: backend
  ports:
  - port: 8000
    name: http
---
# Prometheus scrape configuration (add to prometheus.yml)
# - job_name: 'forge-ai-backend'
#   kubernetes_sd_configs:
#   - role: endpoints
#   relabel_configs:
#   - source_labels: [__meta_kubernetes_service_label_metrics]
#     action: keep
#     regex: "true"
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: forge-ai-monitor
  namespace: forge-ai-prod
  labels:
    app: forge-ai
spec:
  selector:
    matchLabels:
      metrics: "true"
  endpoints:
  - port: http
    path: /metrics
    interval: 30s
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: forge-ai-alerts
  namespace: forge-ai-prod
spec:
  groups:
  - name: forge-ai.rules
    rules:
    # High error rate alert
    - alert: HighErrorRate
      expr: rate(http_requests_total{status=~"5.."}[5m]) > 0.05
      for: 2m
      labels:
        severity: critical
      annotations:
        summary: "High error rate on {{ $labels.app }}"
        description: "Error rate above 5% for more than 2 minutes"
    # High latency alert
    - alert: HighLatency
      expr: histogram_quantile(0.95, http_request_duration_seconds_bucket) > 2
      for: 2m
      labels:
        severity: warning
      annotations:
        summary: "High latency on {{ $labels.app }}"
        description: "95th percentile latency above 2 seconds"
    # Database down alert
    - alert: DatabaseDown
      expr: up{namespace="forge-ai-prod",job="mongodb"} == 0
      for: 1m
      labels:
        severity: critical
      annotations:
        summary: "MongoDB is down"
        description: "MongoDB replica set is unreachable"
    # Redis down alert
    - alert: RedisDown
      expr: up{namespace="forge-ai-prod",job="redis"} == 0
      for: 1m
      labels:
        severity: critical
      annotations:
        summary: "Redis is down"
        description: "Redis cache is unreachable"
    # Build queue depth alert
    - alert: BuildQueueBacklog
      expr: celery_queue_depth > 100
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "Build queue backlog"
        description: "Build queue depth exceeds 100"