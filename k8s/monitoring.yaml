apiVersion: v1
kind: Service
metadata:
  name: backend-metrics
  namespace: forge-ai-prod
  labels:
    app: backend
    metrics: "true"
spec:
  selector:
    app: backend
  ports:
  - port: 8000
    name: http
---
# Prometheus scrape configuration (add to prometheus.yml)
# - job_name: 'forge-ai-backend'
#   kubernetes_sd_configs:
#   - role: endpoints
#   relabel_configs:
#   - source_labels: [__meta_kubernetes_service_label_metrics]
#     action: keep
#     regex: "true"
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: forge-ai-monitor
  namespace: forge-ai-prod
  labels:
    app: forge-ai
spec:
  selector:
    matchLabels:
      metrics: "true"
  endpoints:
  - port: http
    path: /metrics
    interval: 30s
---
# Scrape targets for the database exporter sidecars (k8s/mongodb.yaml,
# k8s/redis.yaml). The `job` Service label + `jobLabel` below pin the
# Prometheus job names to "mongodb"/"redis", which the DatabaseDown/RedisDown
# alerts and the "Forge AI Database" Grafana dashboard expect.
apiVersion: v1
kind: Service
metadata:
  name: mongodb-metrics
  namespace: forge-ai-prod
  labels:
    app: mongodb-exporter
    job: mongodb
spec:
  selector:
    app: mongodb
  ports:
  - port: 9216
    name: metrics
---
apiVersion: v1
kind: Service
metadata:
  name: redis-metrics
  namespace: forge-ai-prod
  labels:
    app: redis-exporter
    job: redis
spec:
  selector:
    app: redis
  ports:
  - port: 9121
    name: metrics
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: mongodb-exporter
  namespace: forge-ai-prod
  labels:
    app: forge-ai
spec:
  jobLabel: job
  selector:
    matchLabels:
      app: mongodb-exporter
  endpoints:
  - port: metrics
    path: /metrics
    interval: 30s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: redis-exporter
  namespace: forge-ai-prod
  labels:
    app: forge-ai
spec:
  jobLabel: job
  selector:
    matchLabels:
      app: redis-exporter
  endpoints:
  - port: metrics
    path: /metrics
    interval: 30s
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: forge-ai-alerts
  namespace: forge-ai-prod
spec:
  groups:
  - name: forge-ai.rules
    rules:
    # High error rate alert
    - alert: HighErrorRate
      expr: rate(http_requests_total{status=~"5.."}[5m]) > 0.05
      for: 2m
      labels:
        severity: critical
      annotations:
        summary: "High error rate on {{ $labels.app }}"
        description: "Error rate above 5% for more than 2 minutes"
    # High latency alert
    - alert: HighLatency
      expr: histogram_quantile(0.95, http_request_duration_seconds_bucket) > 2
      for: 2m
      labels:
        severity: warning
      annotations:
        summary: "High latency on {{ $labels.app }}"
        description: "95th percentile latency above 2 seconds"
    # Database down alert (job="mongodb" scraped via the mongodb-exporter
    # sidecar in k8s/mongodb.yaml and the mongodb-metrics ServiceMonitor above)
    - alert: DatabaseDown
      expr: up{namespace="forge-ai-prod",job="mongodb"} == 0
      for: 1m
      labels:
        severity: critical
      annotations:
        summary: "MongoDB is down"
        description: "MongoDB replica set is unreachable"
    # Redis down alert (job="redis" scraped via the redis-exporter sidecar in
    # k8s/redis.yaml and the redis-metrics ServiceMonitor above)
    - alert: RedisDown
      expr: up{namespace="forge-ai-prod",job="redis"} == 0
      for: 1m
      labels:
        severity: critical
      annotations:
        summary: "Redis is down"
        description: "Redis cache is unreachable"
    # Build queue depth alert
    - alert: BuildQueueBacklog
      expr: celery_queue_depth > 100
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "Build queue backlog"
        description: "Build queue depth exceeds 100"