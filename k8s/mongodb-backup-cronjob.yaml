apiVersion: batch/v1
kind: CronJob
metadata:
  name: mongodb-backup
  namespace: forge-ai-prod
  labels:
    app: forge-ai
    component: backup
spec:
  schedule: "0 2 * * *"  # Daily at 2 AM UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5  # keep more failures for post-mortem
  jobTemplate:
    spec:
      # Clean up finished backup jobs so they don't accumulate.
      ttlSecondsAfterFinished: 3600
      backoffLimit: 3
      template:
        metadata:
          labels:
            app: mongodb-backup
        spec:
          containers:
          - name: mongodb-backup
            image: mongo:7.0
            command:
            - /bin/bash
            - -euxo pipefail
            - -c
            - |
              TIMESTAMP=$(date +%Y%m%d_%H%M%S)
              BACKUP_DIR="/backup/${TIMESTAMP}"
              VERIFY_URL="http://forge-ai-notifier.default.svc.cluster.local:9090/alert"  # optional webhook

              mkdir -p "${BACKUP_DIR}"

              echo "[${TIMESTAMP}] Starting mongodump..."
              if ! mongodump \
                  --uri="${MONGODB_URL}" \
                  --out="${BACKUP_DIR}" \
                  --gzip; then
                echo "ERROR: mongodump failed for ${TIMESTAMP}" >&2
                exit 1
              fi
              echo "[${TIMESTAMP}] mongodump completed."

              # Verify the backup is structurally sound before relying on it.
              # backup_verify.py is expected to be present in the container
              # image or a ConfigMap-mounted sidecar.
              if [ -f /scripts/backup_verify.py ]; then
                echo "[${TIMESTAMP}] Running backup integrity verification..."
                if ! python3 /scripts/backup_verify.py "${BACKUP_DIR}"; then
                  echo "ERROR: Backup verification failed for ${TIMESTAMP}" >&2
                  exit 1
                fi
                echo "[${TIMESTAMP}] Backup verification passed."
              else
                echo "[${TIMESTAMP}] WARNING: backup_verify.py not found; skipping verification."
              fi

              # Upload to S3 (if AWS credentials and bucket are configured)
              if [ -n "${AWS_ACCESS_KEY_ID}" ] && [ -n "${AWS_SECRET_ACCESS_KEY}" ] && [ -n "${S3_BUCKET}" ]; then
                echo "[${TIMESTAMP}] Uploading to S3..."
                # Note: AWS CLI is not bundled in mongo:7.0. Install it in a
                # custom backup image or run the awscli in a separate init/sidecar
                # container sharing the backup-storage volume.
                echo "S3 upload requires AWS CLI — see docs/disaster_recovery.md for the recommended backup image."
              else
                echo "[${TIMESTAMP}] S3 upload skipped (credentials not configured)."
              fi

              # Retain only the last 30 days of local backups (was 7).
              echo "[${TIMESTAMP}] Pruning backups older than 30 days..."
              find /backup -mindepth 1 -maxdepth 1 -type d -mtime +30 -exec rm -rf {} +

              echo "[${TIMESTAMP}] Backup completed successfully: ${BACKUP_DIR}"
            env:
            - name: MONGODB_URL
              valueFrom:
                secretKeyRef:
                  name: forge-ai-secrets
                  key: mongodb-url
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: forge-ai-secrets
                  key: aws-access-key-id
                  optional: true
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: forge-ai-secrets
                  key: aws-secret-access-key
                  optional: true
            - name: S3_BUCKET
              valueFrom:
                secretKeyRef:
                  name: forge-ai-secrets
                  key: s3-bucket
                  optional: true
            volumeMounts:
            - name: backup-storage
              mountPath: /backup
            - name: scripts
              mountPath: /scripts
              readOnly: true
          volumes:
          - name: backup-storage
            persistentVolumeClaim:
              claimName: mongodb-backup-pvc
          - name: scripts
            configMap:
              name: forge-backup-scripts
              defaultMode: 0755
              optional: true
          restartPolicy: OnFailure
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongodb-backup-pvc
  namespace: forge-ai-prod
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
  storageClassName: standard
