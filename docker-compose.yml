services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - MONGODB_URL=mongodb://forge:${MONGO_PASSWORD:?}@mongo:27017/forge?replicaSet=rs0&authSource=admin
      - REDIS_URL=redis://:${REDIS_PASSWORD:?}@redis:6379
      - SANDBOX_HOST=sandbox
      - JWT_SECRET=${JWT_SECRET:?}
      - FIELD_ENCRYPTION_KEY=${FIELD_ENCRYPTION_KEY:?}
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:?}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:?}@redis:6379/0
    volumes:
      - ./backend:/app
      # Read-only: powers GET /admin/engineering-health in local dev. Not
      # present in the prod image (backend/Dockerfile only COPYs ./backend),
      # so that endpoint degrades gracefully there instead of erroring.
      - ./orchestration:/app/orchestration:ro
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  celery-worker:
    build: ./backend
    # -B: embedded beat for the hourly onboarding-email sweep (default "celery" queue).
    command: celery -A celery_app worker -B -s /tmp/celerybeat-schedule --loglevel=info --queues=celery,build,deployment
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - MONGODB_URL=mongodb://forge:${MONGO_PASSWORD:?}@mongo:27017/forge?replicaSet=rs0&authSource=admin
      - REDIS_URL=redis://:${REDIS_PASSWORD:?}@redis:6379
      - JWT_SECRET=${JWT_SECRET:?}
      - FIELD_ENCRYPTION_KEY=${FIELD_ENCRYPTION_KEY:?}
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:?}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:?}@redis:6379/0
    volumes:
      - ./backend:/app
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A celery_app inspect ping -d celery@$$HOSTNAME"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: http://localhost:8000
        VITE_WS_URL: ws://localhost:8000
    ports:
      - "3000:8080"
    environment:
      - VITE_API_URL=http://localhost:8000
      - VITE_WS_URL=ws://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M

  # Single-node replica set rs0 with keyFile + auth, as in production
  # (plan §10.1, U10): the build ledger's money moves are MongoDB
  # transactions, which a standalone server does not support (ledger_v2
  # refuses to run on one). The healthcheck initiates the set on first
  # start and reports healthy once this node is PRIMARY. The member is
  # registered as mongo:27017, so a client on the host machine (not in this
  # network) connects with
  #   mongodb://forge:<password>@localhost:27017/forge?authSource=admin&directConnection=true
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    entrypoint:
      - /bin/bash
      - -c
      - |
        if [ ! -f /data/db/.mongo-keyfile ]; then
          openssl rand -base64 756 > /data/db/.mongo-keyfile
          chmod 400 /data/db/.mongo-keyfile
          chown mongodb:mongodb /data/db/.mongo-keyfile
        fi
        exec docker-entrypoint.sh mongod --replSet rs0 --bind_ip_all --keyFile /data/db/.mongo-keyfile
    environment:
      MONGO_INITDB_ROOT_USERNAME: forge
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test:
        - CMD-SHELL
        - >
          mongosh --quiet -u "$$MONGO_INITDB_ROOT_USERNAME" -p "$$MONGO_INITDB_ROOT_PASSWORD"
          --authenticationDatabase admin
          --eval 'try { if (rs.status().myState !== 1) quit(1); } catch (e) { rs.initiate({_id: "rs0", members: [{_id: 0, host: "mongo:27017"}]}); quit(1); }'
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?}"]
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:?}
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M

volumes:
  mongo_data:
