services:
  - type: keyvalue
    name: forge-redis
    plan: free
    ipAllowList:
      - source: 0.0.0.0/0
        description: everywhere
  - type: web
    name: forge-backend
    runtime: python
    plan: free
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: MONGODB_URL
        value: ${MONGODB_URL}
      - key: REDIS_URL
        fromService:
          name: forge-redis
          type: keyvalue
          property: connectionString
      - key: JWT_SECRET
        value: ${JWT_SECRET}
      - key: FIELD_ENCRYPTION_KEY
        value: ${FIELD_ENCRYPTION_KEY}
      - key: ADMIN_EMAILS
        value: ${ADMIN_EMAILS}
      - key: ALLOWED_HOSTS
        value: ${ALLOWED_HOSTS}
      # Cloudflare quick-tunnel origin for the local dev server. Update this
      # value to a fresh `cloudflared tunnel --url http://localhost:5173` URL
      # whenever it rotates (tunnels are ephemeral).
      - key: FRONTEND_TUNNEL_URL
        value: https://jury-angela-payroll-hydraulic.trycloudflare.com
      - key: API_URL
        value: ${API_URL}
      - key: APP_URL
        value: ${APP_URL}
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
  - type: web
    name: forge-frontend
    runtime: docker
    plan: free
    buildCommand: docker build -t forge-frontend ./frontend
    envVars:
      - key: VITE_API_URL
        value: https://forge-ai-ioom.onrender.com
      - key: VITE_WS_URL
        value: wss://forge-ai-ioom.onrender.com
      - key: VITE_ADMIN_EMAILS
        value: ${ADMIN_EMAILS}
