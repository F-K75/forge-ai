databases:
  - name: forge-redis
    type: redis
    plan: free
    ipAllowList: []

services:
  - type: web
    name: forge-backend
    runtime: python3
    plan: free
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: MONGODB_URL
        value: ${MONGODB_URL}
      - key: REDIS_URL
        fromDatabase:
          name: forge-redis
          property: connectionString
      - key: JWT_SECRET
        value: ${JWT_SECRET}
      - key: FIELD_ENCRYPTION_KEY
        value: ${FIELD_ENCRYPTION_KEY}
      - key: ADMIN_EMAILS
        value: ${ADMIN_EMAILS}
      - key: ALLOWED_HOSTS
        value: ${ALLOWED_HOSTS}
      # Cloudflare quick-tunnel origin for the local dev server. Update this
      # to the current `cloudflared tunnel --url` URL whenever it rotates.
      - key: FRONTEND_TUNNEL_URL
        value: https://seminars-saved-cubic-oops.trycloudflare.com
      - key: API_URL
        value: ${API_URL}
      - key: APP_URL
        value: ${APP_URL}
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
  - type: worker
    name: forge-worker
    runtime: python3
    plan: free
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && celery -A celery_app worker --queues=build,deployment --loglevel=info
    envVars:
      - key: APP_ENV
        value: production
      - key: MONGODB_URL
        value: ${MONGODB_URL}
      - key: REDIS_URL
        fromDatabase:
          name: forge-redis
          property: connectionString
      - key: JWT_SECRET
        value: ${JWT_SECRET}
      - key: FIELD_ENCRYPTION_KEY
        value: ${FIELD_ENCRYPTION_KEY}
      - key: ADMIN_EMAILS
        value: ${ADMIN_EMAILS}
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        value: ${STRIPE_SECRET_KEY}
      - key: STRIPE_PUBLISHABLE_KEY
        value: ${STRIPE_PUBLISHABLE_KEY}
      - key: STRIPE_WEBHOOK_SECRET
        value: ${STRIPE_WEBHOOK_SECRET}
      - key: STRIPE_PRICE_STANDARD_MONTHLY
        value: ${STRIPE_PRICE_STANDARD_MONTHLY}
      - key: STRIPE_PRICE_PRO_MONTHLY
        value: ${STRIPE_PRICE_PRO_MONTHLY}
      - key: STRIPE_PRICE_ENTERPRISE_MONTHLY
        value: ${STRIPE_PRICE_ENTERPRISE_MONTHLY}
      - key: STRIPE_PRICE_STANDARD_ANNUAL
        value: ${STRIPE_PRICE_STANDARD_ANNUAL}
      - key: STRIPE_PRICE_PRO_ANNUAL
        value: ${STRIPE_PRICE_PRO_ANNUAL}
      - key: STRIPE_PRICE_ENTERPRISE_ANNUAL
        value: ${STRIPE_PRICE_ENTERPRISE_ANNUAL}
  - type: web
    name: forge-frontend
    runtime: docker
    plan: free
    buildCommand: docker build -t forge-frontend ./frontend
    envVars:
      - key: VITE_API_URL
        value: https://forge-ai-ioom.onrender.com
      - key: VITE_WS_URL
        value: wss://forge-ai-ioom.onrender.com
      - key: VITE_ADMIN_EMAILS
        value: ${ADMIN_EMAILS}
