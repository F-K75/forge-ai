name: Deploy to staging

on:
  workflow_run:
    workflows: ["CI — Build & Test"]
    types:
      - completed
    branches: [develop]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag (commit SHA) to deploy — set to an earlier SHA to roll back. Leave empty to build and deploy the current commit."
        required: false
        default: ""

concurrency:
  group: staging-deploy
  cancel-in-progress: false

jobs:
  build-push:
    if: >
      (github.event_name == 'workflow_dispatch' && inputs.image_tag == '')
      || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Lowercase image owner
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Resolve image tag
        run: echo "IMAGE_TAG=${{ github.event.workflow_run.head_sha || github.sha }}" >> "$GITHUB_ENV"

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/forge-backend:latest
            ghcr.io/${{ env.OWNER_LC }}/forge-backend:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          build-args: |
            VITE_API_URL=https://${{ vars.STAGING_DOMAIN }}/api
            VITE_WS_URL=wss://${{ vars.STAGING_DOMAIN }}/api
            VITE_ADMIN_EMAILS=${{ vars.ADMIN_EMAILS }}
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/forge-frontend:latest
            ghcr.io/${{ env.OWNER_LC }}/forge-frontend:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

  deploy:
    needs: build-push
    if: >
      always() && (
        needs.build-push.result == 'success'
        || (github.event_name == 'workflow_dispatch' && inputs.image_tag != '')
      )
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Resolve image tag
        run: |
          TAG="${{ inputs.image_tag }}"
          if [ -z "$TAG" ]; then
            TAG="${{ github.event.workflow_run.head_sha || github.sha }}"
          fi
          echo "IMAGE_TAG=$TAG" >> "$GITHUB_ENV"

      - name: Check VPS deploy secrets
        id: creds
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          if [ -z "$VPS_HOST" ] || [ -z "$VPS_USER" ] || [ -z "$VPS_SSH_KEY" ]; then
            echo "::notice::VPS_HOST / VPS_USER / VPS_SSH_KEY are not configured; skipping staging SSH deploy."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Copy compose file and deploy assets to VPS
        if: steps.creds.outputs.configured == 'true'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "docker-compose.staging.yml,deploy,scripts"
          target: /opt/forge-staging

      - name: Pull images and restart stack
        if: steps.creds.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          script: |
            cd /opt/forge-staging
            sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=${{ env.IMAGE_TAG }}/" .env
            docker compose -f docker-compose.staging.yml pull
            docker compose -f docker-compose.staging.yml up -d --remove-orphans
            sleep 10
            DOMAIN=$(grep '^STAGING_DOMAIN=' .env | cut -d= -f2)
            curl -fsS "https://$DOMAIN/api/health"
            docker image prune -f
