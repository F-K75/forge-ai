name: Secret Scanning

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main, develop]

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install git-secrets
        run: |
          if command -v brew &>/dev/null; then
            brew install git-secrets
          else
            # `git-secrets` is not in the default apt repos, so this falls through
            # to the clone+make fallback below. Install `make` first so that path
            # always works.
            sudo apt-get update && sudo apt-get install -y make 2>/dev/null || true
            git clone https://github.com/awslabs/git-secrets.git /tmp/git-secrets && \
              sudo make -C /tmp/git-secrets install
          fi

      - name: Configure git-secrets patterns
        run: |
          git secrets --register-aws
          git secrets --add 'sk-[a-zA-Z0-9]{20,}'       # OpenAI/Anthropic keys
          git secrets --add 'sk_test_[a-zA-Z0-9]{10,}'    # Stripe test keys
          git secrets --add 'sk_live_[a-zA-Z0-9]{10,}'    # Stripe live keys
          git secrets --add 'whsec_[a-zA-Z0-9]{10,}'      # Stripe webhook secrets
          git secrets --add 're_[a-zA-Z0-9]{10,}'         # Resend API keys
          git secrets --add 'ghp_[a-zA-Z0-9]{30,}'        # GitHub personal tokens
          git secrets --add 'gho_[a-zA-Z0-9]{30,}'        # GitHub OAuth tokens
          git secrets --add 'ghu_[a-zA-Z0-9]{30,}'        # GitHub user tokens
          git secrets --add 'ghr_[a-zA-Z0-9]{30,}'        # GitHub refresh tokens
          git secrets --add 'github_pat_[a-zA-Z0-9]{30,}' # GitHub fine-grained tokens
          git secrets --add 'mongodb://[^/]+:[^@]+@'      # MongoDB URLs with credentials
          git secrets --add 'redis://:[^@]+@'             # Redis URLs with passwords
          git secrets --add '[Pp]assword\s*=\s*[^"\s]{6,}'
          git secrets --add '[Ss]ecret\s*=\s*[^"\s]{6,}'
          git secrets --add '[Aa][Pp][Ii]_[Kk][Ee][Yy]\s*=\s*[^"\s]{6,}'
          git secrets --add "[Aa][Pp][Ii]Key\s*[:=]\s*[\"'][^\"']{6,}[\"']"

      - name: Scan repository for secrets (git-secrets)
        run: git secrets --scan
        continue-on-error: false

      - name: Scan all files for secrets (full history)
        run: git secrets --scan-history
        continue-on-error: true

      - name: Check for .env file in PR
        run: |
          if git diff --name-only origin/${{ github.base_ref }}...HEAD 2>/dev/null | grep -q '^.env$'; then
            echo "::error::The .env file must not be committed. Remove it from the PR."
            exit 1
          fi

      - name: Detect secret patterns (grep fallback scanner)
        # git-secrets scans with `grep -w`, so URL-with-credentials patterns
        # (mongodb://user:pass@host, redis://:pass@host) never match there.
        # This grep-based fallback uses plain `grep -E` (no -w) and covers those
        # credential-URL shapes, scanning only the files changed in this PR/push
        # so committed test fixtures / dummy CI values are not re-flagged.
        run: |
          # These definitions are kept identical to scripts/git-hooks/pre-commit.
          # They had silently drifted from it: this copy still carried an
          # unanchored re_ pattern and none of the variable-reference
          # allowances, so it flagged identifiers that merely *contain* "re_"
          # (test_compare_evaluations, test_hmac_signature_deterministic) and
          # every ${VAR} interpolation in docker-compose.prod.yml. The drift
          # went unnoticed because this step never ran -- `git secrets --scan`
          # above fails first, and had been failing on main since 2026-07-17.
          SECRET_PATTERNS=(
            'sk-[a-zA-Z0-9]{20,}'
            'sk_test_[a-zA-Z0-9]{10,}'
            'sk_live_[a-zA-Z0-9]{10,}'
            'pk_test_[a-zA-Z0-9]{10,}'
            'pk_live_[a-zA-Z0-9]{10,}'
            'whsec_[a-zA-Z0-9]{10,}'
            # \b anchored: a real Resend key starts a token. Unanchored, this
            # matches inside any identifier containing "re_" plus 10 characters.
            '\bre_[a-zA-Z0-9]{10,}\b'
            'ghp_[a-zA-Z0-9]{30,}'
            'gho_[a-zA-Z0-9]{30,}'
            'ghu_[a-zA-Z0-9]{30,}'
            'ghr_[a-zA-Z0-9]{30,}'
            'github_pat_[a-zA-Z0-9]{30,}'
            'cf_[a-zA-Z0-9]{20,}'
            'cashfree_[a-zA-Z0-9]{20,}'
            'mongodb://[^/[:space:]]+:[^@[:space:]]+@'
            'mongodb\+srv://[^/[:space:]]+:[^@[:space:]]+@'
            'redis://:[^@[:space:]]+@'
            '[Pp]assword[[:space:]]*=[[:space:]]*[^"[:space:]]{6,}'
            '[Ss]ecret[[:space:]]*=[[:space:]]*[^"[:space:]]{6,}'
            '[Aa][Pp][Ii]_[Kk][Ee][Yy][[:space:]]*=[[:space:]]*[^"[:space:]]{6,}'
            '"[Pp]assword"[[:space:]]*:[[:space:]]*"[^"[:space:]]{6,}"'
          )
          # Files allowed to contain secret-shaped strings: templates, and the
          # scanners' own configs, whose pattern literals necessarily self-match.
          ALLOW_FILE='\.env\..*example$|backend/tests/\.env\.test$|\.gitignore$|\.github/workflows/|scripts/git-hooks/pre-commit$|(^|/)\.gitallowed$|backend/tests/'
          # api_key=<identifier> / <obj>.get( call sites: an unquoted RHS is a
          # variable, attribute or dict reference. A hardcoded credential in
          # Python source is always a quoted string literal.
          _API_KEY_VAR_REF='[Aa][Pp][Ii]_?[Kk][Ee][Yy][[:space:]]*=[[:space:]]*(self\.)?(api_key|[a-zA-Z_][a-zA-Z0-9_]*\.[a-zA-Z0-9_]*api_key)\b|[Aa][Pp][Ii]_?[Kk][Ee][Yy][[:space:]]*=[[:space:]]*[a-zA-Z_][a-zA-Z0-9_]*\.get\(|[Aa][Pp][Ii]_?[Kk][Ee][Yy][[:space:]]*=[[:space:]]*settings\.'
          # Keys read from the environment and passed on as a variable, e.g.
          # os.environ.get(...) or a bare ALL_CAPS identifier -- no literal value.
          _ENV_KEY_REF='[Aa][Pp][Ii]_?[Kk][Ee][Yy][[:space:]]*=[[:space:]]*os\.(environ\.get|getenv)\(|[Aa][Pp][Ii]_?[Kk][Ee][Yy][[:space:]]*=[[:space:]]*[A-Z][A-Z0-9_]*_API_KEY\b|API_KEY='"'"'your-key'"'"''
          # "Password" as a substring of a lazily-imported route component name
          # (React.lazy or the app's lazyWithRetry wrapper).
          _ROUTE_NAME_REF='(ForgotPassword|ResetPassword)[[:space:]]*=[[:space:]]*lazy(WithRetry)?\('
          # ${VAR} / ${VAR:?} / $(VAR) interpolation in compose and k8s manifests
          # is a variable reference resolved at start-up, never a literal value.
          _SHELL_VAR_REF='\$\{[A-Z_][A-Z0-9_]*(:[-?+][^}]*)?\}|\$\([A-Z_][A-Z0-9_]*\)'
          # Known placeholder/dummy values that must not trip the scanner. Real
          # random credentials never contain these exact substrings.
          # The webhook signing-secret field read in backend/api/webhooks.py
          # create_webhook: the `secret` keyword argument, filled from the webhook
          # document's "secret" field (just generated by secrets.token_urlsafe), in
          # the create response. A dict field reference, never a credential literal.
          # GLOBAL by necessity: this scanner greps file *content* and matches
          # `NN:<line>` with no filename, so it cannot scope an exception to one file.
          # It is therefore pinned to that exact full line (leading indentation only,
          # nothing before or after): any literal, any change to the expression or
          # trailing code/comment on the line is still flagged. `[=]` is a literal
          # "=", bracketed so this rule's own text doesn't trip git-secrets when
          # this file is scanned. Keep identical in
          # .github/workflows/secret-scanning.yml and scripts/git-hooks/pre-commit;
          # scripts/git-hooks/test-secret-allowlist.sh checks both.
          _WEBHOOK_SECRET_FIELD_REF='^[0-9]+:[[:space:]]*secret[=]webhook\["secret"\],$'
          ALLOW_LINE="sk_live_test123456789|whsec_test123456789|sk_live_1234567890abcdef|whsec_1234567890abcdef|pk_test_1234567890abcdef|pk_live_1234567890abcdef|cf_test1234567890abcdef|cashfree_test1234567890abcdef|CHANGE_ME|your_[a-zA-Z0-9_]+_here|testpass|ci-dummy|${_API_KEY_VAR_REF}|${_ENV_KEY_REF}|${_ROUTE_NAME_REF}|${_SHELL_VAR_REF}|${_WEBHOOK_SECRET_FIELD_REF}"
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$BASE" ]; then BASE="HEAD~1"; fi
          ADDED_FILES=$(git diff --name-only --diff-filter=ACMR "$BASE" "$GITHUB_SHA" 2>/dev/null || git diff --name-only HEAD~1...HEAD 2>/dev/null)
          EXIT_CODE=0
          COMBINED_PATTERN=$(IFS='|'; echo "${SECRET_PATTERNS[*]}")
          for FILE in $ADDED_FILES; do
            if [ -f "$FILE" ] && ! echo "$FILE" | grep -qE "$ALLOW_FILE"; then
              MATCHES=$(git show ":$FILE" 2>/dev/null | grep -nE "$COMBINED_PATTERN" | grep -vE '^[0-9]+:[[:space:]]*#' | grep -vE "$ALLOW_LINE" || true)
              if [ -n "$MATCHES" ]; then
                echo "::error file=$FILE::Possible secret pattern found in $FILE"
                echo "$MATCHES"
                EXIT_CODE=1
              fi
            fi
          done
          exit $EXIT_CODE

      - name: Allowlist regression probes (scanner definitions)
        # Checks the grep scanner definitions above stay identical to
        # scripts/git-hooks/pre-commit (ALLOW_LINE and SECRET_PATTERNS), that
        # the one allowed webhook field-read line passes, and that literal
        # secrets, modified expressions and near-misses are still flagged.
        run: bash scripts/git-hooks/test-secret-allowlist.sh

      - name: Check deployment configs for hardcoded secrets
        run: |
          echo "🔍 Scanning deployment configs for hardcoded secrets..."
          DEPLOY_FILES=("render.yaml" "docker-compose.prod.yml" "docker-compose.staging.yml" "k8s/secrets.yaml")
          EXIT_CODE=0
          for FILE in "${DEPLOY_FILES[@]}"; do
            if [ ! -f "$FILE" ]; then
              continue
            fi
            MATCHES=$(grep -nE 'sk_live_[a-zA-Z0-9]{10,}|sk_test_[a-zA-Z0-9]{10,}|pk_live_[a-zA-Z0-9]{10,}|pk_test_[a-zA-Z0-9]{10,}|whsec_[a-zA-Z0-9]{10,}|mongodb\+srv://[^/[:space:]]+:[^@[:space:]]+@|mongodb://[^/[:space:]]+:[^@[:space:]]+@|redis://:[^@[:space:]]+@' "$FILE" 2>/dev/null | grep -vE '\$\{[^}]+\}' || true)
            if [ -n "$MATCHES" ]; then
              echo "::error file=$FILE::Hardcoded secret pattern found in deployment config"
              echo "$MATCHES"
              EXIT_CODE=1
            fi
          done
          exit $EXIT_CODE

      - name: Upload scan results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secret-scan-results
          path: /tmp/git-secrets*.log
          retention-days: 7