name: CI — Build & Test

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main, develop]

jobs:
  backend:
    name: Backend — lint, type-check, security, tests
    runs-on: ubuntu-latest
    env:
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      FIELD_ENCRYPTION_KEY: ${{ secrets.FIELD_ENCRYPTION_KEY }}
      MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}
      REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GITHUB_CLIENT_ID: ${{ secrets.GITHUB_CLIENT_ID }}
      GITHUB_CLIENT_SECRET: ${{ secrets.GITHUB_CLIENT_SECRET }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      APP_URL: http://localhost:3000
      API_URL: http://localhost:8000
      ADMIN_EMAILS: admin@forge.ai

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (ruff)
        run: |
          cd backend
          # Scoped to real bugs (undefined names, unused imports, syntax errors) rather than
          # style opinions, so this gate stays meaningful and low-noise.
          ruff check . --select F,E9 --exclude venv

      - name: Security scan — static analysis (bandit)
        run: |
          cd backend
          bandit -r . -x ./venv,./tests -ll

      - name: Security scan — dependency vulnerabilities (pip-audit)
        run: |
          cd backend
          # Every dependency below is pinned to the latest version currently published
          # to PyPI; the ignored advisories below have no available fix yet, or require
          # a major framework upgrade (fastapi/starlette, pytest/pytest-asyncio) that is
          # tracked separately and needs its own regression-testing pass rather than being
          # rushed through this gate. Any NEW, unaddressed advisory still fails the build.
          pip-audit -r requirements.txt \
            --ignore-vuln GHSA-wp53-j4wj-2cfg --ignore-vuln GHSA-mj87-hwqh-73pj \
            --ignore-vuln GHSA-pp6c-gr5w-3c5g --ignore-vuln GHSA-v9pg-7xvm-68hf \
            --ignore-vuln GHSA-5rvq-cxj2-64vf --ignore-vuln GHSA-6jv3-5f52-599m \
            --ignore-vuln GHSA-6w46-j5rx-g56g \
            --ignore-vuln PYSEC-2026-142 --ignore-vuln PYSEC-2026-141 \
            --ignore-vuln GHSA-gc5v-m9x4-r6x2 \
            --ignore-vuln GHSA-mf9w-mj56-hr94 \
            --ignore-vuln GHSA-w853-jp5j-5j7f --ignore-vuln GHSA-qmgc-5h2g-mvrw \
            --ignore-vuln GHSA-wgvc-ghv9-3pmm --ignore-vuln GHSA-c8rr-9gxc-jprv \
            --ignore-vuln GHSA-c38f-wx89-p2xg --ignore-vuln GHSA-3j69-69wj-xqx2 \
            --ignore-vuln GHSA-hx9q-6w63-j58v \
            --ignore-vuln PYSEC-2026-161 --ignore-vuln PYSEC-2026-249 --ignore-vuln PYSEC-2026-248 \
            --ignore-vuln GHSA-f96h-pmfr-66vw --ignore-vuln GHSA-2c2j-9gv5-cj73 \
            --ignore-vuln GHSA-wqp7-x3pw-xc5r --ignore-vuln GHSA-x746-7m8f-x49c \
            --ignore-vuln GHSA-6v7p-g79w-8964

      - name: Type-check (pydantic / import graph smoke test)
        env:
          CI_TEST_MODE: "true"
        run: |
          cd backend
          python -c "import main" || (echo "::error::main.py failed to import cleanly" && exit 1)

      - name: Run backend tests
        run: |
          cd backend
          python -m pytest tests/ -v --timeout=30 \
            --cov=. --cov-report=xml --cov-report=term \
            --junitxml=test-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/test-results.xml
          retention-days: 30

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          retention-days: 30

  frontend:
    name: Frontend — type-check, build, audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Security scan — dependency vulnerabilities (npm audit)
        run: cd frontend && npm audit --audit-level=high

      - name: Type-check & build (tsc + vite)
        run: cd frontend && npm run build

      - name: Upload build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 30

  prod-artifacts:
    runs-on: ubuntu-latest
    env:
      # Dummy values so `compose config` interpolation succeeds
      DOMAIN: ci.invalid
      LETSENCRYPT_EMAIL: ci@ci.invalid
      GHCR_OWNER: ci
      ANTHROPIC_API_KEY: ci-dummy
      JWT_SECRET: ci-dummy-jwt-secret-0123456789abcdef
      MONGO_PASSWORD: ci-dummy
      REDIS_PASSWORD: ci-dummy
      ADMIN_EMAILS: ci@ci.invalid

    steps:
      - uses: actions/checkout@v4

      - name: Validate production compose file
        run: docker compose -f docker-compose.prod.yml config -q

      - name: Build backend production image
        run: docker build backend/

      - name: Build frontend production image
        run: |
          docker build frontend/ \
            --build-arg VITE_API_URL=https://ci.invalid/api \
            --build-arg VITE_WS_URL=wss://ci.invalid/api

      - name: Frontend image build fails without VITE args
        run: |
          if docker build frontend/ -q 2>/dev/null; then
            echo "ERROR: frontend build must fail when VITE_API_URL/VITE_WS_URL are missing"
            exit 1
          fi

  quality-gate:
    name: Quality Gate
    needs: [backend, frontend, prod-artifacts]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Fail if any required job failed
        run: |
          if [ "${{ needs.backend.result }}" != "success" ] || [ "${{ needs.frontend.result }}" != "success" ] || [ "${{ needs.prod-artifacts.result }}" != "success" ]; then
            echo "::error::One or more required CI jobs failed. Blocking merge."
            exit 1
          fi
          echo "All quality gates passed."
