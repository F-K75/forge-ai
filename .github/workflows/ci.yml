name: CI — Build & Test

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main, develop]

jobs:
  backend:
    name: Backend — lint, type-check, security, tests
    runs-on: ubuntu-latest
    env:
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      FIELD_ENCRYPTION_KEY: ${{ secrets.FIELD_ENCRYPTION_KEY }}
      MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}
      REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GITHUB_CLIENT_ID: ${{ secrets.GITHUB_CLIENT_ID }}
      GITHUB_CLIENT_SECRET: ${{ secrets.GITHUB_CLIENT_SECRET }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      APP_URL: http://localhost:3000
      API_URL: http://localhost:8000
      ADMIN_EMAILS: admin@forge.ai

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (ruff)
        run: |
          cd backend
          # Scoped to real bugs (undefined names, unused imports, syntax errors) rather than
          # style opinions, so this gate stays meaningful and low-noise.
          ruff check . --select F,E9 --exclude venv

      - name: Security scan — static analysis (bandit)
        run: |
          cd backend
          bandit -r . -x ./venv,./tests -ll

      - name: Security scan — dependency vulnerabilities (pip-audit)
        run: |
          cd backend
          pip-audit -r requirements.txt \
            --ignore-vuln GHSA-wp53-j4wj-2cfg --ignore-vuln GHSA-6w46-j5rx-g56g \
            --ignore-vuln GHSA-w853-jp5j-5j7f --ignore-vuln GHSA-qmgc-5h2g-mvrw \
            --ignore-vuln GHSA-f96h-pmfr-66vw --ignore-vuln GHSA-2c2j-9gv5-cj73 \
            --ignore-vuln GHSA-6v7p-g79w-8964 \
            --ignore-vuln PYSEC-2026-1845 --ignore-vuln PYSEC-2026-1325

      - name: Type-check (pydantic / import graph smoke test)
        env:
          # Both flags are required: core/config.py only substitutes a dummy
          # jwt_secret when CI_TEST_MODE *and* TESTING are set. With CI_TEST_MODE
          # alone this step aborted on `jwt_secret is required and must not be
          # empty`, because the JWT_SECRET repository secret resolves to an empty
          # string. This step checks that the import graph is clean, not that
          # production secrets are configured, so it runs under the same
          # no-live-services contract as the test step below.
          CI_TEST_MODE: "true"
          TESTING: "true"
        run: |
          cd backend
          python -c "import main" || (echo "::error::main.py failed to import cleanly" && exit 1)

      - name: Production configuration smoke test
        run: |
          cd backend
          # Validate that the production environment contract can be initialized.
          # This ensures FIELD_ENCRYPTION_KEY, APP_ENV, Stripe config, and MongoDB
          # validation work correctly before deployment.
          python -c "
          import os
          os.environ['APP_ENV'] = 'production'
          os.environ['FIELD_ENCRYPTION_KEY'] = '0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef'
          os.environ['MONGODB_URL'] = 'mongodb://forge:testpass@mongo:27017/forge?replicaSet=rs0&authSource=admin'
          os.environ['JWT_SECRET'] = 'a' * 32
          os.environ['REDIS_URL'] = 'redis://:testpass@redis:6379'
          os.environ['STRIPE_SECRET_KEY'] = 'sk_live_test123456789'
          os.environ['STRIPE_PUBLISHABLE_KEY'] = 'pk_live_test123456789'
          os.environ['STRIPE_WEBHOOK_SECRET'] = 'whsec_test123456789'
          os.environ['STRIPE_PRICE_STANDARD_MONTHLY'] = 'price_1A2b3C4d5E6f7G'
          os.environ['STRIPE_PRICE_PRO_MONTHLY'] = 'price_2X3y4Z5a6B7c8D'
          os.environ['STRIPE_PRICE_ENTERPRISE_MONTHLY'] = 'price_3M4n5O6p7Q8r9S'
          os.environ['STRIPE_PRICE_STANDARD_ANNUAL'] = 'price_4T5u6V7w8X9y0Z'
          os.environ['STRIPE_PRICE_PRO_ANNUAL'] = 'price_5A6b7C8d9E0f1G2'
          os.environ['STRIPE_PRICE_ENTERPRISE_ANNUAL'] = 'price_6H7i8J9k0L1m2N3'
          from core.config import get_settings
          s = get_settings()
          assert s.app_env == 'production', 'APP_ENV must be production'
          assert s.field_encryption_key, 'FIELD_ENCRYPTION_KEY must be set'
          assert 'mongo' in s.mongodb_url, 'MongoDB URL must point to mongo service'
          assert 'localhost' not in s.mongodb_url, 'MongoDB must not point to localhost in production'
          assert s.stripe_secret_key.startswith('sk_live_'), 'Stripe key must be live'
          print('✓ Production configuration contract validated successfully')
          "

      - name: Run backend tests
        env:
          # CI_TEST_MODE relaxes config validation so the suite can run with
          # dummy secrets and a fallback MongoDB URL (no live services needed).
          # Without it, Settings() validation aborts collection for every test
          # and the quality gate silently never exercises the code.
          CI_TEST_MODE: "true"
          TESTING: "true"
        run: |
          cd backend
          python -m pytest tests/ -v --timeout=30 \
            --cov=. --cov-report=xml --cov-report=term \
            --cov-fail-under=60 \
            --junitxml=test-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/test-results.xml
          retention-days: 30

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          retention-days: 30

  orchestrator:
    name: Review Board — lint, tests
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}
      REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: orchestrator/requirements.txt

      - name: Install orchestrator dependencies
        run: |
          cd orchestrator
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (ruff)
        run: |
          cd orchestrator
          ruff check . --select F,E9 --exclude venv

      - name: Run orchestrator tests
        run: |
          cd orchestrator
          pytest tests/ -q --timeout=30

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orchestrator-test-results
          path: orchestrator/test-results.xml
          retention-days: 30

  frontend:
    name: Frontend — test, type-check, build, audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python
        # `npm run build`'s prebuild hook runs backend/scripts/export_ws_events.py,
        # which imports backend/core/models.py to regenerate wsEvents.ts from
        # WSEventType — the frontend/backend WebSocket event contract check.
        # core/models.py imports fastapi at module level (PaginationParams
        # uses fastapi.Query), so both it and pydantic must be importable —
        # not the full backend dependency set. Versions must match
        # backend/requirements.txt — fastapi 0.139.0 requires pydantic>=2.9,
        # so an older pydantic pin here makes pip's resolver reject the pair.
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install prebuild script dependencies (pydantic, fastapi)
        run: pip install pydantic==2.13.4 fastapi==0.139.0

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Lint (eslint)
        run: cd frontend && npm run lint

      - name: Unit tests (vitest)
        # Blocks the pipeline: frontend had zero automated tests until this
        # gate was added, so regressions in client logic (auth/CSRF, build
        # store state machine, etc.) would ship silently.
        run: cd frontend && npm test

      - name: Security scan — dependency vulnerabilities (npm audit)
        # Scoped to production deps: the only current advisories (vite/esbuild dev-server
        # path traversal & CORS issues) affect `vite dev`/`vite serve`, never the built
        # artifact, and fixing them requires a major vite bump (5.x has no patched release)
        # that needs its own regression pass rather than being rushed through this gate.
        run: cd frontend && npm audit --omit=dev --audit-level=high

      - name: Type-check & build (tsc + vite)
        run: cd frontend && npm run build

      - name: Upload build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 30

  prod-artifacts:
    runs-on: ubuntu-latest
    env:
      # Dummy values so `compose config` interpolation succeeds
      DOMAIN: ci.invalid
      LETSENCRYPT_EMAIL: ci@ci.invalid
      GHCR_OWNER: ci
      ANTHROPIC_API_KEY: ci-dummy
      JWT_SECRET: ci-dummy-jwt-secret-0123456789abcdef
      FIELD_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      STRIPE_SECRET_KEY: sk_live_ci_dummy_value
      STRIPE_WEBHOOK_SECRET: whsec_ci_dummy_value
      STRIPE_PUBLISHABLE_KEY: pk_live_ci_dummy_value
      STRIPE_PRICE_STANDARD_MONTHLY: price_1CIStandardMonthly
      STRIPE_PRICE_PRO_MONTHLY: price_1CIProMonthly
      STRIPE_PRICE_ENTERPRISE_MONTHLY: price_1CIEnterpriseMonthly
      STRIPE_PRICE_STANDARD_ANNUAL: price_1CIStandardAnnual
      STRIPE_PRICE_PRO_ANNUAL: price_1CIProAnnual
      STRIPE_PRICE_ENTERPRISE_ANNUAL: price_1CIEnterpriseAnnual
      MONGO_PASSWORD: ci-dummy
      REDIS_PASSWORD: ci-dummy
      ADMIN_EMAILS: ci@ci.invalid

    steps:
      - uses: actions/checkout@v4

      - name: Validate production compose file
        run: docker compose -f docker-compose.prod.yml config -q

      - name: Build backend production image
        run: docker build -t forge-backend-ci backend/

      - name: Verify backend Dockerfile has HEALTHCHECK
        # Asserted on the template's own truthiness rather than by grepping the
        # rendered struct. `{{.Config.Healthcheck}}` prints Go field *values*,
        # so a configured healthcheck renders as `{[CMD-SHELL curl ...] ...}` --
        # the string "Cmd" never appears, and the old grep reported every image
        # as missing a HEALTHCHECK even when one was present. backend/Dockerfile
        # has had one all along; this step only ever failed because the prior
        # compose-validation step failed first and skipped it.
        run: |
          if [ "$(docker inspect forge-backend-ci \
                    --format '{{if .Config.Healthcheck}}{{len .Config.Healthcheck.Test}}{{else}}0{{end}}')" -lt 1 ]; then
            echo "::error::backend/Dockerfile is missing HEALTHCHECK instruction"
            exit 1
          fi
          echo "✓ Backend image has HEALTHCHECK"

      - name: Smoke-test backend production configuration
        # MONGODB_URL is quoted below because the connection string contains a
        # literal `&`, which bash otherwise reads as a control operator. That
        # backgrounded the half-built `docker run` (hence "requires at least 1
        # argument") and left the following `-e ...` lines to be executed as
        # commands ("-e: command not found").
        run: |
          docker run --rm \
            -e APP_ENV=production \
            -e "MONGODB_URL=mongodb://forge:ci-dummy@mongo:27017/forge?replicaSet=rs0&authSource=admin" \
            -e REDIS_URL=redis://:ci-dummy@redis:6379 \
            -e JWT_SECRET=ci-dummy-jwt-secret-0123456789abcdef \
            -e FIELD_ENCRYPTION_KEY=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef \
            -e STRIPE_SECRET_KEY=sk_live_ci_dummy_value \
            -e STRIPE_WEBHOOK_SECRET=whsec_ci_dummy_value \
            -e STRIPE_PUBLISHABLE_KEY=pk_live_ci_dummy_value \
            -e STRIPE_PRICE_STANDARD_MONTHLY=price_1CIStandardMonthly \
            -e STRIPE_PRICE_PRO_MONTHLY=price_1CIProMonthly \
            -e STRIPE_PRICE_ENTERPRISE_MONTHLY=price_1CIEnterpriseMonthly \
            -e STRIPE_PRICE_STANDARD_ANNUAL=price_1CIStandardAnnual \
            -e STRIPE_PRICE_PRO_ANNUAL=price_1CIProAnnual \
            -e STRIPE_PRICE_ENTERPRISE_ANNUAL=price_1CIEnterpriseAnnual \
            forge-backend-ci python -c "import main; import celery_app"

      - name: Build frontend production image
        run: |
          docker build frontend/ \
            --build-arg VITE_API_URL=https://ci.invalid/api \
            --build-arg VITE_WS_URL=wss://ci.invalid/api

      - name: Verify frontend Dockerfile has HEALTHCHECK
        run: |
          if ! docker build frontend/ --target=none -q 2>/dev/null; then
            echo "::warning::Cannot inspect multi-stage frontend image; verifying Dockerfile content instead"
            grep -q 'HEALTHCHECK' frontend/Dockerfile || { echo "::error::frontend/Dockerfile is missing HEALTHCHECK instruction"; exit 1; }
            echo "✓ Frontend Dockerfile contains HEALTHCHECK"
          else
            FRONTEND_IMG=$(docker build frontend/ -q 2>/dev/null | tail -1)
            if ! docker inspect "$FRONTEND_IMG" --format '{{.Config.Healthcheck}}' | grep -q 'Cmd'; then
              echo "::error::frontend/Dockerfile final stage is missing HEALTHCHECK instruction"
              exit 1
            fi
            echo "✓ Frontend image has HEALTHCHECK"
          fi

      - name: Verify frontend dist contains entry point
        # The build stage produces /app/dist; verify it contains index.html by
        # inspecting the intermediate image's filesystem.
        #
        # The image id is captured from this single build rather than from a
        # second one. The previous version rebuilt without the --build-arg
        # flags, which the frontend Dockerfile requires -- as the very next
        # step asserts -- so that build failed, 2>/dev/null swallowed the
        # error, BUILD_IMG came back empty and `docker run --rm ""` reported
        # `invalid reference format`. The empty check below keeps any future
        # build failure legible instead of surfacing as a docker usage error.
        run: |
          BUILD_IMG=$(docker build frontend/ \
            --build-arg VITE_API_URL=https://ci.invalid/api \
            --build-arg VITE_WS_URL=wss://ci.invalid/api \
            --target=build -q | tail -1)
          if [ -z "$BUILD_IMG" ]; then
            echo "::error::Frontend build stage produced no image id"
            exit 1
          fi
          if ! docker run --rm "$BUILD_IMG" test -f /app/dist/index.html; then
            echo "::error::Frontend build output is missing /app/dist/index.html"
            exit 1
          fi
          echo "✓ Frontend dist contains index.html"

      - name: Verify frontend build requires VITE_API_URL and VITE_WS_URL
        run: |
          if docker build frontend/ -q 2>/dev/null; then
            echo "ERROR: frontend build must fail when VITE_API_URL/VITE_WS_URL are missing"
            exit 1
          fi
          echo "✓ Frontend build correctly requires VITE_API_URL and VITE_WS_URL"

  quality-gate:
    name: Quality Gate
    needs: [backend, orchestrator, frontend, prod-artifacts]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Fail if any required job failed
        run: |
          if [ "${{ needs.backend.result }}" != "success" ] || [ "${{ needs.orchestrator.result }}" != "success" ] || [ "${{ needs.frontend.result }}" != "success" ] || [ "${{ needs.prod-artifacts.result }}" != "success" ]; then
            echo "::error::One or more required CI jobs failed. Blocking merge."
            exit 1
          fi
          echo "All quality gates passed."
