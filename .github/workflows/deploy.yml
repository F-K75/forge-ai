name: Deploy to production

on:
  workflow_run:
    workflows: ["CI — Build & Test"]
    types:
      - completed
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag (commit SHA) to deploy — set to an earlier SHA to roll back. Leave empty to build and deploy the current commit."
        required: false
        default: ""

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  build-push:
    if: (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success') && (github.event_name == 'push' || inputs.image_tag == '')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Lowercase image owner
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/forge-backend:latest
            ghcr.io/${{ env.OWNER_LC }}/forge-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          build-args: |
            VITE_API_URL=https://${{ vars.PUBLIC_DOMAIN }}/api
            VITE_WS_URL=wss://${{ vars.PUBLIC_DOMAIN }}/api
            VITE_ADMIN_EMAILS=${{ vars.ADMIN_EMAILS }}
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/forge-frontend:latest
            ghcr.io/${{ env.OWNER_LC }}/forge-frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

  deploy:
    needs: build-push
    if: always() && (needs.build-push.result == 'success' || needs.build-push.result == 'skipped')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve image tag
        run: echo "IMAGE_TAG=${{ inputs.image_tag != '' && inputs.image_tag || github.sha }}" >> "$GITHUB_ENV"

      - name: Copy compose file and deploy assets to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "docker-compose.prod.yml,deploy"
          target: /opt/forge

      - name: Pull images and restart stack
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          script: |
            cd /opt/forge
            # Persist the tag so manual `docker compose` commands use the same images
            sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=${{ env.IMAGE_TAG }}/" .env
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            sleep 10
            DOMAIN=$(grep '^DOMAIN=' .env | cut -d= -f2)
            curl -fsS "https://$DOMAIN/api/health"
            docker image prune -f
