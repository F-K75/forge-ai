name: Deploy public website and demo

# The app itself is deployed by Cloudflare Workers Builds (wrangler.toml,
# frontend/worker.ts) to forge-frontend.<account>.workers.dev on every push.
# This workflow deploys the two public Pages sites that link to it.
#
# Deploys use the wrangler CLI directly rather than a third-party GitHub
# Action: cloudflare/pages-action, used before, became unavailable, which
# failed every run of this workflow at "Set up job".

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-pages-deploy
  cancel-in-progress: false

env:
  # wrangler 4 needs Node 22.12+; the frontend itself builds on Node 20.
  WRANGLER_VERSION: "4.162.0"
  # Where "Sign in" / "Sign up" send people. Override with the FORGE_APP_URL
  # repository variable (for example once the app has its own domain).
  APP_URL: ${{ vars.FORGE_APP_URL || 'https://forge-frontend.frendiakeshav75.workers.dev' }}

jobs:
  # ---------------------------------------------------------------------------
  # Public demo: the frontend in demo mode (sample data, no backend), with a
  # "Demo with sample data" banner whose sign-up button goes to the real app.
  # Deployed to its own Pages project, created on first run if missing.
  # ---------------------------------------------------------------------------
  demo:
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.project.outputs.url }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT: ${{ vars.FORGE_DEMO_PAGES_PROJECT || 'forge-demo' }}
    steps:
      - uses: actions/checkout@v4

      - name: Check Cloudflare secrets
        id: creds
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Cloudflare secrets not configured; skipping demo deploy."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Ensure Pages project exists and look up its URL
        id: project
        if: steps.creds.outputs.configured == 'true'
        run: bash scripts/cloudflare-pages-project.sh "$PROJECT" "" "$APP_URL"

      - name: Setup Node.js (build)
        if: steps.creds.outputs.configured == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Setup Python (prebuild hook compatibility)
        if: steps.creds.outputs.configured == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install prebuild script dependencies
        if: steps.creds.outputs.configured == 'true'
        run: pip install pydantic==2.13.4 fastapi==0.139.0

      - name: Install frontend dependencies
        if: steps.creds.outputs.configured == 'true'
        run: npm ci

      - name: Build frontend in demo mode
        if: steps.creds.outputs.configured == 'true'
        env:
          # No VITE_WS_URL: demo mode (sample data, no API calls).
          VITE_PUBLIC_DEMO_APP_URL: ${{ steps.project.outputs.app_url }}
        run: npm run build --workspace=frontend

      - name: Setup Node.js (wrangler)
        if: steps.creds.outputs.configured == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Deploy demo to Cloudflare Pages
        if: steps.creds.outputs.configured == 'true'
        run: npx --yes "wrangler@${WRANGLER_VERSION}" pages deploy frontend/dist --project-name="$PROJECT" --branch=main

      - name: Summary
        if: steps.creds.outputs.configured == 'true'
        run: |
          echo "### Public demo" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.project.outputs.url }} (sign-up goes to ${{ steps.project.outputs.app_url }})" >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Public website: landing.html (waitlist) as its own Pages project, linking
  # to the demo and to sign-in on the app. Its address must be added to the
  # backend's ALLOWED_ORIGINS for the waitlist form to work (see summary).
  # ---------------------------------------------------------------------------
  site:
    runs-on: ubuntu-latest
    needs: demo
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT: ${{ vars.FORGE_SITE_PAGES_PROJECT || 'forge-site' }}
    steps:
      - uses: actions/checkout@v4

      - name: Check Cloudflare secrets
        id: creds
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Cloudflare secrets not configured; skipping site deploy."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Ensure Pages project exists and look up its URL
        id: project
        if: steps.creds.outputs.configured == 'true'
        run: bash scripts/cloudflare-pages-project.sh "$PROJECT" "" "$APP_URL"

      - name: Setup Node.js (wrangler)
        if: steps.creds.outputs.configured == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Assemble site
        if: steps.creds.outputs.configured == 'true'
        env:
          API_URL: https://forge-ai-ioom.onrender.com
          SITE_APP_URL: ${{ steps.project.outputs.app_url }}
          DEMO_URL: ${{ vars.FORGE_DEMO_URL || needs.demo.outputs.url }}
        run: |
          mkdir -p site-dist
          cp landing.html site-dist/index.html
          cp frontend/public/forge.svg site-dist/forge.svg
          node -e '
            const c = { apiUrl: process.env.API_URL, appUrl: process.env.SITE_APP_URL, demoUrl: process.env.DEMO_URL || "" };
            require("fs").writeFileSync("site-dist/site-config.js", "window.FORGE_SITE = " + JSON.stringify(c) + ";\n");
          '
          cat site-dist/site-config.js

      - name: Deploy site to Cloudflare Pages
        if: steps.creds.outputs.configured == 'true'
        run: npx --yes "wrangler@${WRANGLER_VERSION}" pages deploy site-dist --project-name="$PROJECT" --branch=main

      - name: Summary
        if: steps.creds.outputs.configured == 'true'
        run: |
          {
            echo "### Public website"
            echo "${{ steps.project.outputs.url }}"
            echo ""
            echo "For the waitlist form to work, the backend's ALLOWED_ORIGINS must include:"
            echo '`${{ steps.project.outputs.url }}`'
          } >> "$GITHUB_STEP_SUMMARY"
