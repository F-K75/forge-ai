name: Deploy frontend to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Setup Python (prebuild hook compatibility)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install prebuild script dependencies
        run: pip install pydantic==2.13.4 fastapi==0.139.0

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        env:
          VITE_API_URL: https://forge-ai-ioom.onrender.com
          VITE_WS_URL: wss://forge-ai-ioom.onrender.com
          VITE_ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
        run: npm run build --workspace=frontend

      - name: Check Cloudflare secrets
        id: creds
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are not configured; skipping Pages deploy."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to Cloudflare Pages
        if: steps.creds.outputs.configured == 'true'
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: forge-frontend
          directory: frontend/dist

  # ---------------------------------------------------------------------------
  # Public demo: the frontend in demo mode (sample data, no backend), with a
  # "Demo with sample data" banner whose sign-up button goes to the real app.
  # Deployed to its own Pages project, created on first run if missing.
  # ---------------------------------------------------------------------------
  demo:
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.project.outputs.url }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT: ${{ vars.FORGE_DEMO_PAGES_PROJECT || 'forge-demo' }}
      APP_PROJECT: forge-frontend
    steps:
      - uses: actions/checkout@v4

      - name: Check Cloudflare secrets
        id: creds
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Cloudflare secrets not configured; skipping demo deploy."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Ensure Pages project exists and look up URLs
        id: project
        if: steps.creds.outputs.configured == 'true'
        env:
          APP_URL_OVERRIDE: ${{ vars.FORGE_APP_URL }}
        run: bash scripts/cloudflare-pages-project.sh "$PROJECT" "$APP_PROJECT" "$APP_URL_OVERRIDE"

      - name: Setup Node.js
        if: steps.creds.outputs.configured == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Setup Python (prebuild hook compatibility)
        if: steps.creds.outputs.configured == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install prebuild script dependencies
        if: steps.creds.outputs.configured == 'true'
        run: pip install pydantic==2.13.4 fastapi==0.139.0

      - name: Install frontend dependencies
        if: steps.creds.outputs.configured == 'true'
        run: npm ci

      - name: Build frontend in demo mode
        if: steps.creds.outputs.configured == 'true'
        env:
          # No VITE_WS_URL: demo mode (sample data, no API calls).
          VITE_PUBLIC_DEMO_APP_URL: ${{ steps.project.outputs.app_url }}
        run: npm run build --workspace=frontend

      - name: Deploy demo to Cloudflare Pages
        if: steps.creds.outputs.configured == 'true'
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: ${{ env.PROJECT }}
          directory: frontend/dist

      - name: Summary
        if: steps.creds.outputs.configured == 'true'
        run: |
          echo "### Public demo" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.project.outputs.url }} (sign-up goes to ${{ steps.project.outputs.app_url }})" >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Public website: landing.html (waitlist) as its own Pages project, linking
  # to the demo and to sign-in on the app. Its address must be added to the
  # backend's ALLOWED_ORIGINS for the waitlist form to work (see summary).
  # ---------------------------------------------------------------------------
  site:
    runs-on: ubuntu-latest
    needs: demo
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT: ${{ vars.FORGE_SITE_PAGES_PROJECT || 'forge-site' }}
      APP_PROJECT: forge-frontend
    steps:
      - uses: actions/checkout@v4

      - name: Check Cloudflare secrets
        id: creds
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Cloudflare secrets not configured; skipping site deploy."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Ensure Pages project exists and look up URLs
        id: project
        if: steps.creds.outputs.configured == 'true'
        env:
          APP_URL_OVERRIDE: ${{ vars.FORGE_APP_URL }}
        run: bash scripts/cloudflare-pages-project.sh "$PROJECT" "$APP_PROJECT" "$APP_URL_OVERRIDE"

      - name: Assemble site
        if: steps.creds.outputs.configured == 'true'
        env:
          API_URL: https://forge-ai-ioom.onrender.com
          APP_URL: ${{ steps.project.outputs.app_url }}
          DEMO_URL: ${{ vars.FORGE_DEMO_URL || needs.demo.outputs.url }}
        run: |
          mkdir -p site-dist
          cp landing.html site-dist/index.html
          cp frontend/public/forge.svg site-dist/forge.svg
          node -e '
            const c = { apiUrl: process.env.API_URL, appUrl: process.env.APP_URL, demoUrl: process.env.DEMO_URL || "" };
            require("fs").writeFileSync("site-dist/site-config.js", "window.FORGE_SITE = " + JSON.stringify(c) + ";\n");
          '
          cat site-dist/site-config.js

      - name: Deploy site to Cloudflare Pages
        if: steps.creds.outputs.configured == 'true'
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: ${{ env.PROJECT }}
          directory: site-dist

      - name: Summary
        if: steps.creds.outputs.configured == 'true'
        run: |
          {
            echo "### Public website"
            echo "${{ steps.project.outputs.url }}"
            echo ""
            echo "For the waitlist form to work, the backend's ALLOWED_ORIGINS must include:"
            echo '`${{ steps.project.outputs.url }}`'
          } >> "$GITHUB_STEP_SUMMARY"
