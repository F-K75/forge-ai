# Real-LLM validation (manual, billed).
#
# Runs backend/scripts/validate_clarifications.py from one exact, reviewed
# commit against the real Anthropic API. It makes REAL, BILLED calls and never
# runs on push or pull_request.
#
# TRUST BOUNDARY -- read before approving a run:
#   Approving the `llm-validation` deployment authorizes the ENTIRE selected
#   commit to run with the Anthropic key: its requirements.txt (pip install
#   executes package code), every module the script imports, and the script
#   itself. Install and validation share one runner, so code installed in an
#   earlier step can still be running when the key is exposed in the final
#   step. Only approve a commit_sha you have reviewed as the current head of
#   the named pull request.
#
# How it is protected:
#   1. Dispatch from `main` (the default branch). The tested code is chosen by
#      `commit_sha`, a full 40-character SHA -- never a branch name -- so it
#      cannot move between approval and execution.
#   2. Job `preflight` (no environment, no secrets) validates the inputs,
#      confirms the commit exists and equals the pull request's current head,
#      and writes the SHA and PR link to the job summary for the approver.
#      The SHA is also in the run name.
#   3. Job `validate` runs in the `llm-validation` Environment, so it waits
#      for an approval. After approval it re-checks the PR head and fails if
#      the PR has moved, so a stale approval cannot authorize newer code.
#   4. ANTHROPIC_API_KEY is an Environment secret and is exposed only in the
#      final validation step -- not during checkout or dependency install.
#   5. Third-party actions are pinned to full commit SHAs.
#   6. Each job gets only the token permissions it needs.
#
# Repository settings this file cannot enforce (configure in Settings ->
# Environments -> llm-validation):
#   - Required reviewers, with "Prevent self-review" enabled.
#   - "Allow administrators to bypass configured protection rules" disabled.
#   - ANTHROPIC_API_KEY as an environment secret: a dedicated key with a
#     spend limit, rotated after the validation campaign.

name: LLM validation (manual, billed)

run-name: "LLM validation · PR #${{ inputs.pr_number }} @ ${{ inputs.commit_sha }}"

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number whose current head is being validated"
        required: true
      commit_sha:
        description: "Full 40-character commit SHA -- must equal that PR's current head"
        required: true
      checks:
        description: "Space-separated subset of: ambiguous clear conflict binding (empty = all four)"
        required: false
        default: ""
      cost_acknowledgement:
        description: "Type exactly: I understand this makes billed Anthropic API calls"
        required: true

permissions: {}

concurrency:
  group: llm-validation
  cancel-in-progress: false

jobs:
  preflight:
    name: Preflight (no secrets)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Validate inputs and confirm the commit is the PR head
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr_number }}
          COMMIT_SHA: ${{ inputs.commit_sha }}
          CHECKS: ${{ inputs.checks }}
          ACK: ${{ inputs.cost_acknowledgement }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }

          [ "$ACK" = "I understand this makes billed Anthropic API calls" ] \
            || fail "Cost acknowledgement missing or incorrect. Nothing was called."
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]{0,6}$ ]] || fail "pr_number must be a positive integer."
          [[ "$COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]] \
            || fail "commit_sha must be a full 40-character lowercase hex SHA (branch names and short SHAs are refused)."
          for c in $CHECKS; do
            case "$c" in ambiguous|clear|conflict|binding) ;; *) fail "Unknown check: $c" ;; esac
          done

          gh api "repos/$REPO/commits/$COMMIT_SHA" --jq .sha >/dev/null \
            || fail "Commit $COMMIT_SHA does not exist in $REPO."

          pr_json=$(gh api "repos/$REPO/pulls/$PR_NUMBER") || fail "Pull request #$PR_NUMBER not found."
          head_sha=$(jq -r .head.sha <<<"$pr_json")
          state=$(jq -r .state <<<"$pr_json")
          head_repo=$(jq -r .head.repo.full_name <<<"$pr_json")
          title=$(jq -r .title <<<"$pr_json")
          [ "$state" = "open" ] || fail "Pull request #$PR_NUMBER is $state, not open."
          [ "$head_sha" = "$COMMIT_SHA" ] \
            || fail "commit_sha $COMMIT_SHA is not the current head of PR #$PR_NUMBER (head is $head_sha)."

          {
            echo "## Approval request: billed real-LLM validation"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Pull request | [#$PR_NUMBER](https://github.com/$REPO/pull/$PR_NUMBER) — $title |"
            echo "| Head repository | \`$head_repo\` |"
            echo "| **Commit that will receive the Anthropic key** | [\`$COMMIT_SHA\`](https://github.com/$REPO/commit/$COMMIT_SHA) |"
            echo "| Checks | \`${CHECKS:-ambiguous clear conflict binding}\` |"
            echo "| Expected usage | ~6 small calls + 1 full file generation (all four checks) |"
            echo ""
            echo "Approve the \`llm-validation\` deployment only if you have reviewed this exact commit,"
            echo "including its dependencies and every module the validation script imports."
          } >> "$GITHUB_STEP_SUMMARY"

  validate:
    name: Real Anthropic validation
    needs: preflight
    runs-on: ubuntu-latest
    environment: llm-validation
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
    services:
      # Usage/audit writes go to Mongo; a live server avoids slow fail-open
      # timeouts. Disposable, CI-only credentials.
      mongodb:
        image: mongo:7.0
        ports: ["27017:27017"]
        env:
          MONGO_INITDB_ROOT_USERNAME: root
          MONGO_INITDB_ROOT_PASSWORD: testpass
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Re-check after approval that the PR head has not moved
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr_number }}
          COMMIT_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          pr_json=$(gh api "repos/$REPO/pulls/$PR_NUMBER")
          head_sha=$(jq -r .head.sha <<<"$pr_json")
          state=$(jq -r .state <<<"$pr_json")
          if [ "$state" != "open" ] || [ "$head_sha" != "$COMMIT_SHA" ]; then
            echo "::error::PR #$PR_NUMBER changed after approval (state=$state, head=$head_sha, approved=$COMMIT_SHA). Refusing to run; start a new run for the new head."
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.commit_sha }}
          persist-credentials: false

      - name: Confirm checkout is exactly the approved commit
        env:
          COMMIT_SHA: ${{ inputs.commit_sha }}
        run: |
          [ "$(git rev-parse HEAD)" = "$COMMIT_SHA" ] || { echo "::error::Checked-out HEAD does not match commit_sha."; exit 1; }
          [ -f backend/scripts/validate_clarifications.py ] \
            || { echo "::error::backend/scripts/validate_clarifications.py is not in this commit."; exit 1; }

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install backend dependencies (no secrets in this step)
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run validation (strict; the Anthropic key is exposed only here)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MONGODB_URL: mongodb://root:testpass@localhost:27017/forge?authSource=admin
          CHECKS: ${{ inputs.checks }}
        run: |
          set -euo pipefail
          if [ -z "${ANTHROPIC_API_KEY:-}" ]; then
            echo "::error::ANTHROPIC_API_KEY is not set in the llm-validation environment."
            exit 1
          fi
          cd backend
          # Throwaway per-run values for settings the backend always requires.
          JWT_SECRET="$(python -c 'import secrets; print(secrets.token_urlsafe(48))')"
          FIELD_ENCRYPTION_KEY="$(python -c 'import secrets; print(secrets.token_hex(32))')"
          export JWT_SECRET FIELD_ENCRYPTION_KEY
          # Exits non-zero if any check fails. The question checks use
          # raise_errors=True, so a failed provider call is a failure, never a
          # false "zero questions" pass.
          # shellcheck disable=SC2086  # CHECKS is a validated word list
          python scripts/validate_clarifications.py $CHECKS 2>&1 | tee validation-output.txt

      - name: Upload validation transcript
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: llm-validation-transcript-${{ inputs.commit_sha }}
          path: backend/validation-output.txt
          if-no-files-found: ignore
          retention-days: 30
