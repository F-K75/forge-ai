name: Feature request
description: Suggest an idea or improvement for Forge
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem are you trying to solve? What's frustrating or missing today?
      placeholder: I want to... but currently...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like Forge to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workarounds or other approaches you've thought about?
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Build pipeline / agents
        - Frontend / UI
        - Backend API
        - Auth / billing
        - Deployment
        - Integrations
        - Docs
        - Other
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, mockups, links, or anything else that helps.
