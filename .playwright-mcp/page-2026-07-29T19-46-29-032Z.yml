        - generic [ref=e503]:
          - generic [ref=e504]:
            - term [ref=e505]: How is Forge different from a code-completion tool?
            - definition [ref=e506]: Autocomplete finishes a line. Forge's agents plan, build, and validate a full application from a single prompt.
          - generic [ref=e507]:
            - term [ref=e508]: Is this just a chatbot with extra steps?
            - definition [ref=e509]: No. Forge doesn't wait for you to prompt each step. Specialist agents plan, hand off, and validate the build on their own — you step in to review and ship.
          - generic [ref=e510]:
            - term [ref=e511]: Do I own the code Forge writes?
            - definition [ref=e512]: Yes. Every build can sync to a GitHub repository you control — no lock-in.
          - generic [ref=e513]:
            - term [ref=e514]: What happens if a build fails validation?
            - definition [ref=e515]: The debug loop automatically reruns the responsible agent, up to three times, before a build is marked failed.
          - generic [ref=e516]:
            - term [ref=e517]: Can I use my own model key?
            - definition [ref=e518]: Yes — on the Pro plan you can bring your own Anthropic key for full control over usage and cost.
          - generic [ref=e519]:
            - term [ref=e520]: Can Forge work with an existing codebase?
            - definition [ref=e521]: Today, Forge builds new projects from a prompt. Support for extending existing codebases is on the roadmap.
